name: Update Radha Night chart
on:
  workflow_dispatch:
  push:
    paths:
      - "dp777/scripts/update_radha_night.py"
      - ".github/workflows/update-radha-night.yml"
  schedule:
    - cron: "*/30 * * * *"
permissions:
  contents: write
concurrency:
  group: update-radha-night
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Refresh source archive
        run: python dp777/scripts/update_radha_night.py
      - name: Commit changed archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dp777/data/charts/radha-night.json
          if git diff --cached --quiet; then
            echo "No Radha Night source changes."
          else
            git commit -m "Refresh Radha Night historical chart"
            git fetch origin main
            git rebase origin/main
            git push
          fi
