var DATA={"1":{"q":[{"n":1,"en":["The excess pressure inside a soap bubble of 40 mm diameter, if the surface tension of the soap solution is 0.04 N/m, is:"],"te":["The excess pressure inside a soap bubble of 40 mm diameter, if the surface tension of the soap solution is 0.04 N/m, is:"],"o":[["2 N/m²","2 N/m²"],["4 N/m²","4 N/m²"],["8 N/m²","8 N/m²"],["16 N/m²","16 N/m²"]],"sec":"A. Properties of Fluids","a":2,"xe":"Soap bubble has two surfaces: p = 8σ/d = 8 × 0.04/0.04 = 8 N/m². (4 N/m² is the droplet formula 4σ/d — the trap.)","xt":"Soap bubble has two surfaces: p = 8σ/d = 8 × 0.04/0.04 = 8 N/m². (4 N/m² is the droplet formula 4σ/d — the trap.)"},{"n":2,"en":["Statement 1: Kinematic viscosity is the ratio of dynamic viscosity to mass density.","Statement 2: The CGS unit of kinematic viscosity is the stoke, equal to 1 cm²/s."],"te":["Statement 1: Kinematic viscosity is the ratio of dynamic viscosity to mass density.","Statement 2: The CGS unit of kinematic viscosity is the stoke, equal to 1 cm²/s."],"o":[["Both statements are true","Both statements are true"],["Both statements are false","Both statements are false"],["Statement 1 is true, Statement 2 is false","Statement 1 is true, Statement 2 is false"],["Statement 1 is false, Statement 2 is true","Statement 1 is false, Statement 2 is true"]],"sec":"A. Properties of Fluids","a":0,"xe":"ν = μ/ρ, and 1 stoke = 1 cm²/s = 10⁻⁴ m²/s. Both true. (Poise is the CGS unit of dynamic viscosity.)","xt":"ν = μ/ρ, and 1 stoke = 1 cm²/s = 10⁻⁴ m²/s. Both true. (Poise is the CGS unit of dynamic viscosity.)"},{"n":3,"en":["The gauge pressure at a depth of 5 m below the free surface of an oil of specific gravity 0.8 is (take ρg of water = 9810 N/m³):"],"te":["The gauge pressure at a depth of 5 m below the free surface of an oil of specific gravity 0.8 is (take ρg of water = 9810 N/m³):"],"o":[["31.39 kN/m²","31.39 kN/m²"],["39.24 kN/m²","39.24 kN/m²"],["49.05 kN/m²","49.05 kN/m²"],["61.31 kN/m²","61.31 kN/m²"]],"sec":"B. Pressure and Its Measurement","a":1,"xe":"p = S × 9810 × h = 0.8 × 9810 × 5 = 39,240 N/m² = 39.24 kN/m². (49.05 is for water; 61.31 divides by 0.8 instead of multiplying.)","xt":"p = S × 9810 × h = 0.8 × 9810 × 5 = 39,240 N/m² = 39.24 kN/m². (49.05 is for water; 61.31 divides by 0.8 instead of multiplying.)"},{"n":4,"en":["In a hydraulic press, the ram is 200 mm in diameter and the plunger is 20 mm in diameter. A force of 100 N applied on the plunger lifts a load of:"],"te":["In a hydraulic press, the ram is 200 mm in diameter and the plunger is 20 mm in diameter. A force of 100 N applied on the plunger lifts a load of:"],"o":[["100 kN","100 kN"],["1 kN","1 kN"],["2 kN","2 kN"],["10 kN","10 kN"]],"sec":"B. Pressure and Its Measurement","a":3,"xe":"Pascal's law: W = F × (D/d)² = 100 × (200/20)² = 100 × 100 = 10,000 N = 10 kN. (1 kN uses the diameter ratio instead of the area ratio.)","xt":"Pascal's law: W = F × (D/d)² = 100 × (200/20)² = 100 × 100 = 10,000 N = 10 kN. (1 kN uses the diameter ratio instead of the area ratio.)"},{"n":5,"en":["A simple U-tube mercury manometer is connected to a pipe carrying water. The centre of the pipe is 0.2 m above the mercury level in the left limb, and the mercury in the right limb (open to atmosphere) stands 0.3 m above that level. The gauge pressure head at the centre of the pipe is:"],"te":["A simple U-tube mercury manometer is connected to a pipe carrying water. The centre of the pipe is 0.2 m above the mercury level in the left limb, and the mercury in the right limb (open to atmosphere) stands 0.3 m above that level. The gauge pressure head at the centre of the pipe is:"],"o":[["4.08 m of water","4.08 m of water"],["4.28 m of water","4.28 m of water"],["3.88 m of water","3.88 m of water"],["0.50 m of water","0.50 m of water"]],"sec":"B. Pressure and Its Measurement","a":2,"xe":"Equate at the lower mercury level: h_A + 0.2 = 13.6 × 0.3 → h_A = 4.08 − 0.2 = 3.88 m of water. (4.08 forgets the water column; 4.28 adds it instead of subtracting.)","xt":"Equate at the lower mercury level: h_A + 0.2 = 13.6 × 0.3 → h_A = 4.08 − 0.2 = 3.88 m of water. (4.08 forgets the water column; 4.28 adds it instead of subtracting.)"},{"n":6,"en":["Which of the following statements is INCORRECT?"],"te":["Which of the following statements is INCORRECT?"],"o":[["A piezometer can be used to measure vacuum (negative gauge) pressure","A piezometer can be used to measure vacuum (negative gauge) pressure"],["Absolute pressure = atmospheric pressure + gauge pressure","Absolute pressure = atmospheric pressure + gauge pressure"],["Standard atmospheric pressure is 760 mm of mercury","Standard atmospheric pressure is 760 mm of mercury"],["Mechanical gauges such as the Bourdon tube are used for high pressures","Mechanical gauges such as the Bourdon tube are used for high pressures"]],"sec":"B. Pressure and Its Measurement","a":0,"xe":"Under vacuum, air would be sucked into an open piezometer tube; it only reads positive gauge pressure of liquids. The other three are correct.","xt":"Under vacuum, air would be sucked into an open piezometer tube; it only reads positive gauge pressure of liquids. The other three are correct."},{"n":7,"en":["A circular plate of 2 m diameter is immersed vertically in water with its centre 3 m below the free surface. The total pressure force and the depth of the centre of pressure are:"],"te":["A circular plate of 2 m diameter is immersed vertically in water with its centre 3 m below the free surface. The total pressure force and the depth of the centre of pressure are:"],"o":[["92.5 kN and 3.00 m","92.5 kN and 3.00 m"],["92.5 kN and 3.083 m","92.5 kN and 3.083 m"],["61.6 kN and 3.083 m","61.6 kN and 3.083 m"],["92.5 kN and 3.25 m","92.5 kN and 3.25 m"]],"sec":"C. Hydrostatic Forces, Buoyancy and Floating Bodies","a":1,"xe":"F = ρgAx̄ = 9810 × π × 1² × 3 = 92.5 kN. h* = x̄ + I_G/(Ax̄) = 3 + (d²/16)/3 = 3 + 0.25/3 = 3.083 m. The centre of pressure is always below the centroid.","xt":"F = ρgAx̄ = 9810 × π × 1² × 3 = 92.5 kN. h* = x̄ + I_G/(Ax̄) = 3 + (d²/16)/3 = 3 + 0.25/3 = 3.083 m. The centre of pressure is always below the centroid."},{"n":8,"en":["A quadrant gate of radius 2 m and width 1 m holds back water whose free surface is level with the top of the gate. The horizontal and vertical components of the hydrostatic force on the gate are:"],"te":["A quadrant gate of radius 2 m and width 1 m holds back water whose free surface is level with the top of the gate. The horizontal and vertical components of the hydrostatic force on the gate are:"],"o":[["30.82 kN and 19.62 kN","30.82 kN and 19.62 kN"],["19.62 kN and 19.62 kN","19.62 kN and 19.62 kN"],["39.24 kN and 30.82 kN","39.24 kN and 30.82 kN"],["19.62 kN and 30.82 kN","19.62 kN and 30.82 kN"]],"sec":"C. Hydrostatic Forces, Buoyancy and Floating Bodies","a":3,"xe":"F_H = force on the vertical projection (2 m × 1 m, x̄ = 1 m) = 9810 × 2 × 1 = 19.62 kN. F_V = weight of water in the quadrant = 9810 × (π × 2²/4) × 1 = 30.82 kN.","xt":"F_H = force on the vertical projection (2 m × 1 m, x̄ = 1 m) = 9810 × 2 × 1 = 19.62 kN. F_V = weight of water in the quadrant = 9810 × (π × 2²/4) × 1 = 30.82 kN."},{"n":9,"en":["A body weighs 300 N in air and 200 N when fully immersed in water. Its specific gravity is:"],"te":["A body weighs 300 N in air and 200 N when fully immersed in water. Its specific gravity is:"],"o":[["1.5","1.5"],["2.0","2.0"],["3.0","3.0"],["0.67","0.67"]],"sec":"C. Hydrostatic Forces, Buoyancy and Floating Bodies","a":2,"xe":"Loss of weight = buoyant force = 100 N = weight of an equal volume of water. S = weight in air / loss of weight = 300/100 = 3.","xt":"Loss of weight = buoyant force = 100 N = weight of an equal volume of water. S = weight in air / loss of weight = 300/100 = 3."},{"n":10,"en":["A rectangular pontoon 5 m long and 3 m wide floats in water with a depth of immersion of 0.8 m. Its centre of gravity is 0.6 m above the base. The metacentric height is about:"],"te":["A rectangular pontoon 5 m long and 3 m wide floats in water with a depth of immersion of 0.8 m. Its centre of gravity is 0.6 m above the base. The metacentric height is about:"],"o":[["0.54 m","0.54 m"],["0.94 m","0.94 m"],["1.14 m","1.14 m"],["0.74 m","0.74 m"]],"sec":"C. Hydrostatic Forces, Buoyancy and Floating Bodies","a":3,"xe":"BM = I/V = (5 × 3³/12)/(5 × 3 × 0.8) = 11.25/12 = 0.94 m. B is at 0.4 m above the base, so BG = 0.6 − 0.4 = 0.2 m. GM = BM − BG = 0.74 m. (0.94 is BM alone; 1.14 adds BG.)","xt":"BM = I/V = (5 × 3³/12)/(5 × 3 × 0.8) = 11.25/12 = 0.94 m. B is at 0.4 m above the base, so BG = 0.6 − 0.4 = 0.2 m. GM = BM − BG = 0.74 m. (0.94 is BM alone; 1.14 adds BG.)"},{"n":11,"en":["Consider the following statements:","I. A floating body is in stable equilibrium when its metacentre lies above its centre of gravity.","II. A fully submerged body is in stable equilibrium when its centre of buoyancy lies above its centre of gravity.","III. Raising the centre of gravity of a floating body increases its metacentric height.","IV. A larger metacentric height gives a longer period of rolling.","Which of the above statements are correct?"],"te":["Consider the following statements:","I. A floating body is in stable equilibrium when its metacentre lies above its centre of gravity.","II. A fully submerged body is in stable equilibrium when its centre of buoyancy lies above its centre of gravity.","III. Raising the centre of gravity of a floating body increases its metacentric height.","IV. A larger metacentric height gives a longer period of rolling.","Which of the above statements are correct?"],"o":[["I and II only","I and II only"],["I, II and III only","I, II and III only"],["II and IV only","II and IV only"],["I, II and IV only","I, II and IV only"]],"sec":"C. Hydrostatic Forces, Buoyancy and Floating Bodies","a":0,"xe":"III is false: raising G increases BG, so GM = BM − BG falls. IV is false: T = 2π√(k²/(g·GM)), so a larger GM gives a shorter, jerkier roll.","xt":"III is false: raising G increases BG, so GM = BM − BG falls. IV is false: T = 2π√(k²/(g·GM)), so a larger GM gives a shorter, jerkier roll."},{"n":12,"en":["A pipe of 300 mm diameter carrying water at 2 m/s branches into two pipes of 150 mm and 200 mm diameter. If the velocity in the 150 mm pipe is 3 m/s, the velocity in the 200 mm pipe is about:"],"te":["A pipe of 300 mm diameter carrying water at 2 m/s branches into two pipes of 150 mm and 200 mm diameter. If the velocity in the 150 mm pipe is 3 m/s, the velocity in the 200 mm pipe is about:"],"o":[["2.00 m/s","2.00 m/s"],["2.81 m/s","2.81 m/s"],["3.50 m/s","3.50 m/s"],["4.50 m/s","4.50 m/s"]],"sec":"D. Fluid Kinematics","a":1,"xe":"Continuity: d₁²V₁ = d₂²V₂ + d₃²V₃ → 0.09 × 2 = 0.0225 × 3 + 0.04 × V₃ → V₃ = (0.18 − 0.0675)/0.04 = 2.81 m/s.","xt":"Continuity: d₁²V₁ = d₂²V₂ + d₃²V₃ → 0.09 × 2 = 0.0225 × 3 + 0.04 × V₃ → V₃ = (0.18 − 0.0675)/0.04 = 2.81 m/s."},{"n":13,"en":["For a steady, two-dimensional, incompressible flow, u = 4xy. If v = 0 at y = 0, the velocity component v is:"],"te":["For a steady, two-dimensional, incompressible flow, u = 4xy. If v = 0 at y = 0, the velocity component v is:"],"o":[["−4y²","−4y²"],["2y²","2y²"],["−2y²","−2y²"],["−2x²","−2x²"]],"sec":"D. Fluid Kinematics","a":2,"xe":"Continuity: ∂u/∂x + ∂v/∂y = 0 → 4y + ∂v/∂y = 0 → v = −2y² + f(x); v = 0 at y = 0 gives f(x) = 0. (2023 Q115 asked for a missing component in the same way.)","xt":"Continuity: ∂u/∂x + ∂v/∂y = 0 → 4y + ∂v/∂y = 0 → v = −2y² + f(x); v = 0 at y = 0 gives f(x) = 0. (2023 Q115 asked for a missing component in the same way.)"},{"n":14,"en":["The stream function of a two-dimensional flow is ψ = 2xy. The magnitude of the velocity at the point (1, 2) is:"],"te":["The stream function of a two-dimensional flow is ψ = 2xy. The magnitude of the velocity at the point (1, 2) is:"],"o":[["2.00 units","2.00 units"],["3.46 units","3.46 units"],["6.00 units","6.00 units"],["4.47 units","4.47 units"]],"sec":"D. Fluid Kinematics","a":3,"xe":"u = −∂ψ/∂y = −2x = −2; v = ∂ψ/∂x = 2y = 4. |V| = √(4 + 16) = 4.47 units. The magnitude does not depend on the sign convention used.","xt":"u = −∂ψ/∂y = −2x = −2; v = ∂ψ/∂x = 2y = 4. |V| = √(4 + 16) = 4.47 units. The magnitude does not depend on the sign convention used."},{"n":15,"en":["For the two-dimensional flow with stream function ψ = x² − y², consider the following statements:","I. The flow is irrotational.","II. The magnitude of velocity at the point (1, 1) is 2√2 units.","III. A velocity potential function exists for this flow.","Which of the above statements are correct?"],"te":["For the two-dimensional flow with stream function ψ = x² − y², consider the following statements:","I. The flow is irrotational.","II. The magnitude of velocity at the point (1, 1) is 2√2 units.","III. A velocity potential function exists for this flow.","Which of the above statements are correct?"],"o":[["I only","I only"],["I and III only","I and III only"],["II and III only","II and III only"],["I, II and III","I, II and III"]],"sec":"D. Fluid Kinematics","a":3,"xe":"∂²ψ/∂x² + ∂²ψ/∂y² = 2 − 2 = 0 → irrotational, so φ exists. u = −∂ψ/∂y = 2y = 2, v = ∂ψ/∂x = 2x = 2 → |V| = 2√2. All three are correct.","xt":"∂²ψ/∂x² + ∂²ψ/∂y² = 2 − 2 = 0 → irrotational, so φ exists. u = −∂ψ/∂y = 2y = 2, v = ∂ψ/∂x = 2x = 2 → |V| = 2√2. All three are correct."},{"n":16,"en":["For the flow field u = 2y, v = 3x, the vorticity is:"],"te":["For the flow field u = 2y, v = 3x, the vorticity is:"],"o":[["1.0","1.0"],["0.5","0.5"],["5.0","5.0"],["2.5","2.5"]],"sec":"D. Fluid Kinematics","a":0,"xe":"Vorticity = ∂v/∂x − ∂u/∂y = 3 − 2 = 1. Rotation ω = ½ × vorticity = 0.5 (the trap). 2.5 is the shear strain rate ½(3 + 2).","xt":"Vorticity = ∂v/∂x − ∂u/∂y = 3 − 2 = 1. Rotation ω = ½ × vorticity = 0.5 (the trap). 2.5 is the shear strain rate ½(3 + 2)."},{"n":17,"en":["Water flows at a constant discharge through a pipe whose diameter reduces gradually along its length. The flow is:"],"te":["Water flows at a constant discharge through a pipe whose diameter reduces gradually along its length. The flow is:"],"o":[["steady and uniform","steady and uniform"],["steady and non-uniform","steady and non-uniform"],["unsteady and uniform","unsteady and uniform"],["unsteady and non-uniform","unsteady and non-uniform"]],"sec":"D. Fluid Kinematics","a":1,"xe":"Discharge constant with time → steady. Velocity changes from section to section (V ∝ 1/d²) → non-uniform. (2023 Q107 asked the draining-tank case: unsteady and uniform.)","xt":"Discharge constant with time → steady. Velocity changes from section to section (V ∝ 1/d²) → non-uniform. (2023 Q107 asked the draining-tank case: unsteady and uniform.)"},{"n":18,"en":["In a steady two-dimensional flow, u = 2x and v = −2y. The magnitude of the acceleration of a fluid particle at the point (1, 1) is:"],"te":["In a steady two-dimensional flow, u = 2x and v = −2y. The magnitude of the acceleration of a fluid particle at the point (1, 1) is:"],"o":[["4.00 units","4.00 units"],["8.00 units","8.00 units"],["5.66 units","5.66 units"],["2.83 units","2.83 units"]],"sec":"D. Fluid Kinematics","a":2,"xe":"a_x = u ∂u/∂x + v ∂u/∂y = 2x × 2 = 4; a_y = u ∂v/∂x + v ∂v/∂y = (−2y)(−2) = 4. |a| = 4√2 = 5.66. The flow is steady, yet the convective acceleration is not zero.","xt":"a_x = u ∂u/∂x + v ∂u/∂y = 2x × 2 = 4; a_y = u ∂v/∂x + v ∂v/∂y = (−2y)(−2) = 4. |a| = 4√2 = 5.66. The flow is steady, yet the convective acceleration is not zero."},{"n":19,"en":["Assertion (A): In steady flow, streamlines, pathlines and streaklines coincide.","Reason (R): In steady flow, the velocity at any given point does not change with time."],"te":["Assertion (A): In steady flow, streamlines, pathlines and streaklines coincide.","Reason (R): In steady flow, the velocity at any given point does not change with time."],"o":[["Both A and R are true, and R is the correct explanation of A","Both A and R are true, and R is the correct explanation of A"],["Both A and R are true, but R is NOT the correct explanation of A","Both A and R are true, but R is NOT the correct explanation of A"],["A is true, but R is false","A is true, but R is false"],["A is false, but R is true","A is false, but R is true"]],"sec":"D. Fluid Kinematics","a":0,"xe":"Because the velocity field is fixed in time, every particle passing a point follows the same streamline, so all three lines are identical. R explains A.","xt":"Because the velocity field is fixed in time, every particle passing a point follows the same streamline, so all three lines are identical. R explains A."},{"n":20,"en":["Which of the following statements about a flow net is INCORRECT?"],"te":["Which of the following statements about a flow net is INCORRECT?"],"o":[["Streamlines and equipotential lines intersect each other at right angles","Streamlines and equipotential lines intersect each other at right angles"],["A flow net can be drawn for a rotational flow","A flow net can be drawn for a rotational flow"],["It is used to estimate seepage and uplift pressure under hydraulic structures","It is used to estimate seepage and uplift pressure under hydraulic structures"],["Where the streamlines are closer together, the velocity is higher","Where the streamlines are closer together, the velocity is higher"]],"sec":"D. Fluid Kinematics","a":1,"xe":"Equipotential lines exist only when a velocity potential exists, i.e. for irrotational flow. A flow net cannot be drawn for rotational flow or where the flow separates (2023 Q104, Q105).","xt":"Equipotential lines exist only when a velocity potential exists, i.e. for irrotational flow. A flow net cannot be drawn for rotational flow or where the flow separates (2023 Q104, Q105)."},{"n":21,"en":["Water flows through a horizontal pipe that tapers from 200 mm to 100 mm diameter. At the 200 mm section the pressure is 100 kN/m² and the velocity is 2 m/s. Neglecting losses, the pressure at the 100 mm section is:"],"te":["Water flows through a horizontal pipe that tapers from 200 mm to 100 mm diameter. At the 200 mm section the pressure is 100 kN/m² and the velocity is 2 m/s. Neglecting losses, the pressure at the 100 mm section is:"],"o":[["130 kN/m²","130 kN/m²"],["94 kN/m²","94 kN/m²"],["40 kN/m²","40 kN/m²"],["70 kN/m²","70 kN/m²"]],"sec":"E. Fluid Dynamics and Flow Measurement","a":3,"xe":"V₂ = 2 × (200/100)² = 8 m/s. p₂ = p₁ + ρ(V₁² − V₂²)/2 = 100,000 + 500 × (4 − 64) = 70,000 N/m² = 70 kN/m². (94 uses V₂ = 4 m/s — the diameter ratio instead of the area ratio.)","xt":"V₂ = 2 × (200/100)² = 8 m/s. p₂ = p₁ + ρ(V₁² − V₂²)/2 = 100,000 + 500 × (4 − 64) = 70,000 N/m² = 70 kN/m². (94 uses V₂ = 4 m/s — the diameter ratio instead of the area ratio.)"},{"n":22,"en":["A venturimeter has an inlet-to-throat area ratio of 4. The difference of piezometric head between the inlet and the throat is 0.75 m of the flowing liquid. Taking g = 10 m/s², the theoretical velocity at the throat is:"],"te":["A venturimeter has an inlet-to-throat area ratio of 4. The difference of piezometric head between the inlet and the throat is 0.75 m of the flowing liquid. Taking g = 10 m/s², the theoretical velocity at the throat is:"],"o":[["3.87 m/s","3.87 m/s"],["4.00 m/s","4.00 m/s"],["4.24 m/s","4.24 m/s"],["16.0 m/s","16.0 m/s"]],"sec":"E. Fluid Dynamics and Flow Measurement","a":1,"xe":"V₂ = √[2gh/(1 − (a₂/a₁)²)] = √[15/(1 − 1/16)] = √16 = 4 m/s. (3.87 = √(2gh) ignores the velocity of approach.)","xt":"V₂ = √[2gh/(1 − (a₂/a₁)²)] = √[15/(1 − 1/16)] = √16 = 4 m/s. (3.87 = √(2gh) ignores the velocity of approach.)"},{"n":23,"en":["A differential mercury manometer connected to a venturimeter carrying oil of specific gravity 0.8 shows a reading of 20 cm. The difference of pressure head is:"],"te":["A differential mercury manometer connected to a venturimeter carrying oil of specific gravity 0.8 shows a reading of 20 cm. The difference of pressure head is:"],"o":[["2.52 m of oil","2.52 m of oil"],["2.72 m of oil","2.72 m of oil"],["3.20 m of oil","3.20 m of oil"],["3.40 m of oil","3.40 m of oil"]],"sec":"E. Fluid Dynamics and Flow Measurement","a":2,"xe":"h = x(S_Hg/S_oil − 1) = 0.2 × (13.6/0.8 − 1) = 0.2 × 16 = 3.2 m of oil. (2.52 uses the factor 12.6, which is only for water.)","xt":"h = x(S_Hg/S_oil − 1) = 0.2 × (13.6/0.8 − 1) = 0.2 × 16 = 3.2 m of oil. (2.52 uses the factor 12.6, which is only for water.)"},{"n":24,"en":["Consider the following statements:","I. The coefficient of discharge of a venturimeter is higher than that of an orifice meter.","II. An orifice meter is cheaper and needs less space than a venturimeter.","III. The loss of head in an orifice meter is smaller than in a venturimeter.","IV. Both meters work on Bernoulli's principle.","Which of the above statements are correct?"],"te":["Consider the following statements:","I. The coefficient of discharge of a venturimeter is higher than that of an orifice meter.","II. An orifice meter is cheaper and needs less space than a venturimeter.","III. The loss of head in an orifice meter is smaller than in a venturimeter.","IV. Both meters work on Bernoulli's principle.","Which of the above statements are correct?"],"o":[["I and II only","I and II only"],["I, II and IV only","I, II and IV only"],["II, III and IV only","II, III and IV only"],["I, II, III and IV","I, II, III and IV"]],"sec":"E. Fluid Dynamics and Flow Measurement","a":1,"xe":"III is false: the sudden contraction and expansion at an orifice plate cause a larger permanent head loss; the venturimeter's gradual cones keep the loss small (C_d ≈ 0.98 against ≈ 0.62).","xt":"III is false: the sudden contraction and expansion at an orifice plate cause a larger permanent head loss; the venturimeter's gradual cones keep the loss small (C_d ≈ 0.98 against ≈ 0.62)."},{"n":25,"en":["A pitot tube placed in a pipe shows a stagnation head of 6 m and a static head of 5 m of water. Taking the coefficient of the tube as 1 and g = 9.81 m/s², the velocity at that point is:"],"te":["A pitot tube placed in a pipe shows a stagnation head of 6 m e:"],"o":[["remains constant along the pipe","remains constant along the pipe"],["increases in the direction of flow","increases in the direction of flow"],["decreases in the direction of flow","decreases in the direction of flow"],["is zero","is zero"]],"sec":"E. Fluid Dynamics and Flow Measurement","a":0,"xe":"The gap between TEL and HGL is the velocity head V²/2g. With a constant diameter and discharge, V is constant, so the two lines are parallel and both slope down due to friction.","xt":"The gap between TEL and HGL is the velocity head V²/2g. With a constant diameter and discharge, V is constant, so the two lines are parallel and both slope down due to friction."},{"n":28,"en":["Statement 1: Euler's equation of motion is obtained by applying Newton's second law to a fluid element, considering only pressure and gravity forces.","Statement 2: Bernoulli's equation is obtained by integrating Euler's equation along a streamline for an incompressible fluid."],"te":["Statement 1: Euler's equation of motion is obtained by applying Newton's second law to a fluid element, considering only pressure and gravity forces.","Statement 2: Bernoulli's equation is obtained by integrating Euler's equation along a streamline for an incompressible fluid."],"o":[["Both statements are true","Both statements are true"],["Both statements are false","Both statements are false"],["Statement 1 is true, Statement 2 is false","Statement 1 is true, Statement 2 is false"],["Statement 1 is false, Statement 2 is true","Statement 1 is false, Statement 2 is true"]],"sec":"E. Fluid Dynamics and Flow Measurement","a":0,"xe":"Euler's equation: dp/ρ + g dz + V dV = 0 (viscous forces neglected). Integrating with ρ constant gives p/ρg + V²/2g + z = constant. Both true.","xt":"Euler's equation: dp/ρ + g dz + V dV = 0 (viscous forces neglected). Integrating with ρ constant gives p/ρg + V²/2g + z = constant. Both true."},{"n":29,"en":["Water flows at 2 m/s through a pipe 1000 m long and 200 mm in diameter. If the Darcy friction factor f is 0.02 (h_f = fLV²/2gD) and g = 10 m/s², the loss of head due to friction is:"],"te":["Water flows at 2 m/s through a pipe 1000 m long and 200 mm in diameter. If the Darcy friction factor f is 0.02 (h_f = fLV²/2gD) and g = 10 m/s², the loss of head due to friction is:"],"o":[["5 m","5 m"],["10 m","10 m"],["20 m","20 m"],["80 m","80 m"]],"sec":"F. Flow Through Pipes","a":2,"xe":"h_f = fLV²/(2gD) = 0.02 × 1000 × 4/(2 × 10 × 0.2) = 80/4 = 20 m. (80 m wrongly uses 4f — check which form of the formula the question gives.)","xt":"h_f = fLV²/(2gD) = 0.02 × 1000 × 4/(2 × 10 × 0.2) = 80/4 = 20 m. (80 m wrongly uses 4f — check which form of the formula the question gives.)"},{"n":30,"en":["For laminar flow through a circular pipe at a Reynolds number of 1600, the Darcy friction factor is:"],"te":["For laminar flow through a circular pipe at a Reynolds number of 1600, the Darcy friction factor is:"],"o":[["0.01","0.01"],["0.004","0.004"],["0.4","0.4"],["0.04","0.04"]],"sec":"F. Flow Through Pipes","a":3,"xe":"f = 64/Re = 64/1600 = 0.04. (0.01 is 16/Re, the friction coefficient f′ used in the 4f′LV²/2gD form.)","xt":"f = 64/Re = 64/1600 = 0.04. (0.01 is 16/Re, the friction coefficient f′ used in the 4f′LV²/2gD form.)"},{"n":31,"en":["Two pipes of the same length and the same friction factor, of diameters D and 2D, are connected in parallel between two reservoirs. The ratio of the discharge in the larger pipe to that in the smaller pipe is:"],"te":["Two pipes of the same length and the same friction factor, of diameters D and 2D, are connected in parallel between two reservoirs. The ratio of the discharge in the larger pipe to that in the smaller pipe is:"],"o":[["5.66","5.66"],["2","2"],["4","4"],["32","32"]],"sec":"F. Flow Through Pipes","a":0,"xe":"Same head loss in parallel: h_f ∝ Q²/D⁵ → Q ∝ D^2.5. Ratio = 2^2.5 = 5.66. (32 = 2⁵ forgets the square root; 4 uses the area ratio only.)","xt":"Same head loss in parallel: h_f ∝ Q²/D⁵ → Q ∝ D^2.5. Ratio = 2^2.5 = 5.66. (32 = 2⁵ forgets the square root; 4 uses the area ratio only.)"},{"n":32,"en":["Water flows from a larger pipe into a smaller pipe in which the velocity is 4 m/s. If the coefficient of contraction is 0.625 and g = 10 m/s², the loss of head due to the sudden contraction is:"],"te":["Water flows from a larger pipe into a smaller pipe in which the velocity is 4 m/s. If the coefficient of contraction is 0.625 and g = 10 m/s², the loss of head due to the sudden contraction is:"],"o":[["0.400 m","0.400 m"],["0.288 m","0.288 m"],["0.800 m","0.800 m"],["0.480 m","0.480 m"]],"sec":"F. Flow Through Pipes","a":1,"xe":"h_c = (1/C_c − 1)² V₂²/2g = (1.6 − 1)² × 16/20 = 0.36 × 0.8 = 0.288 m. (0.4 m = 0.5V²/2g is used only when C_c is not given.)","xt":"h_c = (1/C_c − 1)² V₂²/2g = (1.6 − 1)² × 16/20 = 0.36 × 0.8 = 0.288 m. (0.4 m = 0.5V²/2g is used only when C_c is not given.)"},{"n":33,"en":["A pipe supplies water to a nozzle from a reservoir under a total head of 240 m. For maximum transmission of power, the loss of head due to friction and the efficiency of transmission are:"],"te":["A pipe supplies water to a nozzle from a reservoir under a total head of 240 m. For maximum transmission of power, the loss of head due to friction and the efficiency of transmission are:"],"o":[["120 m and 50 %","120 m and 50 %"],["80 m and 33.3 %","80 m and 33.3 %"],["60 m and 75 %","60 m and 75 %"],["80 m and 66.7 %","80 m and 66.7 %"]],"sec":"F. Flow Through Pipes","a":3,"xe":"Power is maximum when h_f = H/3 = 80 m. Efficiency = (H − h_f)/H = 160/240 = 66.7 %. (Asked twice in 2023: Q96 and Q120.)","xt":"Power is maximum when h_f = H/3 = 80 m. Efficiency = (H − h_f)/H = 160/240 = 66.7 %. (Asked twice in 2023: Q96 and Q120.)"},{"n":34,"en":["Water flows at 1.5 m/s in a rigid pipe 2100 m long. The valve at the end is closed completely in 2 s. If the velocity of the pressure wave is 1400 m/s, the rise in pressure is:"],"te":["Water flows at 1.5 m/s in a rigid pipe 2100 m long.  of lift is 0.8 and the density of air is 1.2 kg/m³, the lift force is:"],"o":[["9.6 N","9.6 N"],["48 N","48 N"],["192 N","192 N"],["96 N","96 N"]],"sec":"G. Boundary Layer, Drag and Lift","a":3,"xe":"F_L = C_L A ρU²/2 = 0.8 × 2 × 1.2 × 100/2 = 96 N. (192 N forgets the ½.)","xt":"F_L = C_L A ρU²/2 = 0.8 × 2 × 1.2 × 100/2 = 96 N. (192 N forgets the ½.)"},{"n":41,"en":["A jet of water of cross-sectional area 0.002 m² and velocity 10 m/s strikes a stationary flat plate inclined at 30° to the axis of the jet. The force normal to the plate is:"],"te":["A jet of water of cross-sectional area 0.002 m² and velocity 10 m/s strikes a stationary flat plate inclined at 30° to the axis of the jet. The force normal to the plate is:"],"o":[["50 N","50 N"],["100 N","100 N"],["173 N","173 N"],["200 N","200 N"]],"sec":"H. Impact of Jets and Hydraulic Turbines","a":1,"xe":"F_n = ρaV² sin θ = 1000 × 0.002 × 100 × 0.5 = 100 N. (200 N is for a plate normal to the jet; 173 N uses cos 30°.)","xt":"F_n = ρaV² sin θ = 1000 × 0.002 × 100 × 0.5 = 100 N. (200 N is for a plate normal to the jet; 173 N uses cos 30°.)"},{"n":42,"en":["A Pelton wheel works under a net head of 180 m. Taking the coefficient of velocity of the nozzle as 1 and g = 10 m/s², the theoretical bucket speed for maximum efficiency is:"],"te":["A Pelton wheel works under a net head of 180 m. Taking the coefficient of velocity of the nozzle as 1 and g = 10 m/s², the theoretical bucket speed for maximum efficiency is:"],"o":[["15 m/s","15 m/s"],["42.4 m/s","42.4 m/s"],["60 m/s","60 m/s"],["30 m/s","30 m/s"]],"sec":"H. Impact of Jets and Hydraulic Turbines","a":3,"xe":"Jet velocity V = √(2gH) = √3600 = 60 m/s. Maximum efficiency when u = V/2 = 30 m/s. (In practice the speed ratio is about 0.46.)","xt":"Jet velocity V = √(2gH) = √3600 = 60 m/s. Maximum efficiency when u = V/2 = 30 m/s. (In practice the speed ratio is about 0.46.)"},{"n":43,"en":["A turbine runs at 200 rpm and discharges 9 m³/s under a head of 25 m. If the head falls to 16 m, with the same efficiency its speed and discharge become:"],"te":["A turbine runs at 200 rpm and discharges 9 m³/s under a head of 25 m. If the head falls to 16 m, with the same efficiency its speed and discharge become:"],"o":[["160 rpm and 7.2 m³/s","160 rpm and 7.2 m³/s"],["128 rpm and 5.76 m³/s","128 rpm and 5.76 m³/s"],["160 rpm and 5.76 m³/s","160 rpm and 5.76 m³/s"],["250 rpm and 11.25 m³/s","250 rpm and 11.25 m³/s"]],"sec":"H. Impact of Jets and Hydraulic Turbines","a":0,"xe":"Unit quantities: N ∝ √H and Q ∝ √H. √(16/25) = 0.8 → N = 160 rpm, Q = 7.2 m³/s. (Power ∝ H^1.5 would fall to 0.512 times.)","xt":"Unit quantities: N ∝ √H and Q ∝ √H. √(16/25) = 0.8 → N = 160 rpm, Q = 7.2 m³/s. (Power ∝ H^1.5 would fall to 0.512 times.)"},{"n":44,"en":["Which of the following statements is INCORRECT?"],"te":["Which of the following statements is INCORRECT?"],"o":[["A Pelton wheel is a tangential-flow impulse turbine","A Pelton wheel is a tangential-flow impulse turbine"],["A modern Francis turbine is an inward mixed-flow reaction turbine","A modern Francis turbine is an inward mixed-flow reaction turbine"],["The runner blades of a Kaplan turbine are fixed and cannot be adjusted","The runner blades of a Kaplan turbine are fixed and cannot be adjusted"],["A draft tube is used with reaction turbines","A draft tube is used with reaction turbines"]],"sec":"H. Impact of Jets and Hydraulic Turbines","a":2,"xe":"Kaplan runner blades are adjustable while running (double regulation with the guide vanes). A propeller turbine is the one with fixed blades.","xt":"Kaplan runner blades are adjustable while running (double regulation with the guide vanes). A propeller turbine is the one with fixed blades."},{"n":45,"en":["Statement 1: The specific speed of a turbine is given by N√P / H^(5/4).","Statement 2: Among Pelton, Francis and Kaplan turbines, the Pelton wheel has the highest specific speed."],"te":["Statement 1: The specific speed of a turbine is given by N√P / H^(5/4).","Statement 2: Among Pelton, Francis and Kaplan turbines, the Pelton wheel has the highest specific speed."],"o":[["Both statements are true","Both statements are true"],["Both statements are false","Both statements are false"],["Statement 1 is true, Statement 2 is false","Statement 1 is true, Statement 2 is false"],["Statement 1 is false, Statement 2 is true","Statement 1 is false, Statement 2 is true"]],"sec":"H. Impact of Jets and Hydraulic Turbines","a":2,"xe":"Statement 2 is false: Pelton has the lowest specific speed (about 10–60), Francis 60–300, Kaplan 300–1000 (2023 Q121).","xt":"Statement 2 is false: Pelton has the lowest specific speed (about 10–60), Francis 60–300, Kaplan 300–1000 (2023 Q121)."},{"n":46,"en":["A centrifugal pump runs at 1000 rpm and delivers 0.16 m³/s against a manometric head of 16 m. Its specific speed (N√Q / H^(3/4)) is:"],"te":["A centrifugal pump runs at 1000 rpm and delivers 0.16 m³/s against a manometric head of 16 m. Its specific speed (N√Q / H^(3/4)) is:"],"o":[["25","25"],["50","50"],["100","100"],["400","400"]],"sec":"I. Centrifugal Pumps and Control Valves","a":1,"xe":"N_s = 1000 × √0.16 / 16^0.75 = 1000 × 0.4/8 = 50. (Pump: √Q and H^3/4. Turbine: √P and H^5/4.)","xt":"N_s = 1000 × √0.16 / 16^0.75 = 1000 × 0.4/8 = 50. (Pump: √Q and H^3/4. Turbine: √P and H^5/4.)"},{"n":47,"en":["A centrifugal pump develops a manometric head of 18 m. The whirl velocity at the outlet is 12 m/s and the tangential velocity of the impeller at the outlet is 20 m/s. Taking g = 10 m/s², the manometric efficiency is:"],"te":["A centrifugal pump develops a manometric head of 18 m. The whirl velocity at the outlet is 12 m/s and the tangential velocity of the impeller at the outlet is 20 m/s. Taking g = 10 m/s², the manometric efficiency is:"],"o":[["60 %","60 %"],["133 %","133 %"],["90 %","90 %"],["75 %","75 %"]],"sec":"I. Centrifugal Pumps and Control Valves","a":3,"xe":"η_mano = gH_m/(V_w2 u₂) = 10 × 18/(12 × 20) = 180/240 = 75 %. (133 % is the ratio inverted — an efficiency cannot exceed 100 %.)","xt":"η_mano = gH_m/(V_w2 u₂) = 10 × 18/(12 × 20) = 180/240 = 75 %. (133 % is the ratio inverted — an efficiency cannot exceed 100 %.)"},{"n":48,"en":["A pump set has to deliver water against a total head of 150 m. Each identical impeller develops 37.5 m at the design discharge. The arrangement needed is:"],"te":["A pump set has to deliver water against a total head of 150 m. Each identical impeller develops 37.5 m at the design discharge. The arrangement needed is:"],"o":[["Four impellers in parallel","Four impellers in parallel"],["Four impellers in series","Four impellers in series"],["Two impellers in series","Two impellers in series"],["Two impellers in parallel","Two impellers in parallel"]],"sec":"I. Centrifugal Pumps and Control Valves","a":1,"xe":"Series (multistage) arrangement adds the heads: 150/37.5 = 4 impellers in series, each passing the same discharge. Parallel adds discharge, not head (2023 Q137).","xt":"Series (multistage) arrangement adds the heads: 150/37.5 = 4 impellers in series, each passing the same discharge. Parallel adds discharge, not head (2023 Q137)."},{"n":49,"en":["Assertion (A): A foot valve is fitted at the lower end of the suction pipe of a centrifugal pump.","Reason (R): It is a non-return valve that keeps the suction pipe and casing full of water when the pump is stopped."],"te":["Assertion (A): A foot valve is fitted at the lower end of the suction pipe of a centrifugal pump.","Reason (R): It is a non-return valve that keeps the suction pipe and casing full of water when the pump is stopped."],"o":[["Both A and R are true, and R is the correct explanation of A","Both A and R are true, and R is the correct explanation of A"],["Both A and R are true, but R is NOT the correct explanation of A","Both A and R are true, but R is NOT the correct explanation of A"],["A is true, but R is false","A is true, but R is false"],["A is false, but R is true","A is false, but R is true"]],"sec"   function L(){return T[med]}
  function drawHead(){
    var l=L();if(CFG.only){document.querySelector(".seg[aria-label=Medium]").parentNode.hidden=true}if(Object.keys(DATA).length<2){$("tsel").parentNode.hidden=true}if(CFG.v)l.v=CFG.v[med];document.documentElement.lang=med;
    document.title=l.title(tn)+" · Sulabham";
    $("title").textContent=l.title(tn);$("sub").textContent=CFG.sub?CFG.sub[med]:l.vol[tn-1];
    $("info").innerHTML=l.info+(CFG.note?"<p><b>"+esc(CFG.note[med])+"</b></p>":"")+'<label class="chk"><input type="checkbox" id="inst"'+(st.inst?" checked":"")+'> '+esc(l.instant)+'</label>';
    $("inst").onchange=function(e){st.inst=e.target.checked;save();drawQs()};
    document.querySelectorAll("[data-m]").forEach(function(b){b.setAttribute("aria-pressed",b.dataset.m===med)});
    $("tsel").innerHTML=[1,2,3].map(function(n){return'<button type="button" data-t="'+n+'" aria-pressed="'+(n===tn)+'">'+esc(l.tab(n))+'</button>'}).join("");
    $("reset").textContent=l.reset;$("pdf").textContent=l.pdf;$("pdf").href=PDFS[tn];
    var bk={group1:["index.html#group1",l.back],group2:["index.html#group2",l.back.replace("1","2")],si:["index.html#si",med==="te"?"← SIకి వెనక్కి":"← Back to SI"],aee:["aee.html#lessons","← AEE course"],pc:["index.html#pc",med==="te"?"← కానిస్టేబుల్‌కి వెనక్కి":"← Back to Constable"]}[from]||["index.html#group1",l.back];
    $("back").href=bk[0];$("back").textContent=bk[1];$("foot").textContent=l.foot;
  }
  function qText(q){var x=med==="te"?q.te:q.en;if(typeof x==="string")return esc(x);
    return x.map(function(l,i){var c=i===0?"l0":(/^(List|జాబితా)/.test(l)?"lh":(/^(Assertion|Reason|ధృవీకరణ|కారణం)/.test(l)?"la":(/^([IVX]+|[A-D]|\d{1,2})\.\s/.test(l)?"li":"lc")));return'<span class="'+c+'">'+esc(l)+'</span>'}).join("")}
  function oText(o){return med==="te"?o[1]:o[0]}
  function drawQs(){
    var l=L(),qs=DATA[tn].q,h="";
    qs.forEach(function(q,i){
      var a=st.a[i],show=st.done||(st.inst&&a!==undefined);
      h+='<li class="q" id="q'+(i+1)+'"><div class="qt"><span class="qn">'+(i+1)+'.</span>'+qText(q)+'</div><div class="opts">';
      q.o.forEach(function(o,j){
        var cls="";if(show){if(j===q.a)cls="right";else if(j===a)cls="wrong"}
        h+='<button type="button" data-i="'+i+'" data-j="'+j+'" aria-pressed="'+(a===j)+'"'+(cls?' class="'+cls+'"':"")+(show?" disabled":"")+'><b>'+(CFG.lab?"("+CFG.lab[j]+")":"ABCD"[j])+'</b><span>'+esc(oText(o))+'</span></button>';
      });
      h+='</div>';
      if(show){var x=med==="te"?q.xt:q.xe,ans=(CFG.lab?"("+CFG.lab[q.a]+") ":"ABCD"[q.a]+") ")+""+oText(q.o[q.a]);
        if(a===undefined)h+='<p class="why skip"><b>'+esc(l.skip)+': '+esc(ans)+'.</b> '+esc(x)+'</p>';
        else h+='<p class="why'+(a===q.a?"":" no")+'"><b>'+esc(l.ans)+': '+esc(ans)+'.</b> '+esc(x)+'</p>'}
      h+='</li>';
    });
    $("qs").innerHTML=h;drawBar();
  }
  function counts(){var c=0,w=0,qs=DATA[tn].q;qs.forEach(function(q,i){var a=st.a[i];if(a===undefined)return;if(a===q.a)c++;else w++});return{c:c,w:w,s:qs.length-c-w,m:Math.round((c-w/3)*100)/100}}
  function drawBar(){
    var l=L(),n=Object.keys(st.a).length;$("cnt").textContent=l.cnt(n);$("meter").style.width=(n*2)+"%";
    var k=counts();$("mk").textContent=(st.done||st.inst)?(l.m+": "+k.m+" / 50"):"";
    [$("submit"),$("submit2")].forEach(function(b){b.textContent=st.done?l.submitted:l.submit;b.disabled=st.done});
    drawTimer();
  }
  function drawTimer(){var t=Math.max(0,st.left),m=Math.floor(t/60),s=t%60;$("timer").textContent=(m<10?"0":"")+m+":"+(s<10?"0":"")+s;$("timer").classList.toggle("low",t<300)}
  function tick(){if(st.done)return;st.left--;if(st.left%10===0)save();drawTimer();if(st.left<=0){finish(true)}}
  function startTimer(){clearInterval(timerId);if(!st.done)timerId=setInterval(tick,1000)}
  function finish(auto){
    var l=L();if(!auto){var u=50-Object.keys(st.a).length;if(u>0&&!confirm(l.confirm(u)))return}
    st.done=true;clearInterval(timerId);save();drawQs();drawResult(auto);$("result").scrollIntoView({behavior:"smooth"})
  }
  function drawResult(auto){
    var l=L(),k=counts(),r=$("result");if(!st.done){r.hidden=true;return}
    var v=l.v.filter(function(x){return k.m>=x[1]})[0][0];
    r.hidden=false;r.innerHTML='<h2>'+esc(l.res)+' · '+esc(l.title(tn))+'</h2>'+(auto?'<p>'+esc(l.time)+'</p>':'')+
      '<div class="stats"><div><b>'+k.m+'</b><small>'+l.m+' / 50</small></div><div><b>'+k.c+'</b><small>'+l.c+'</small></div><div><b>'+k.w+'</b><small>'+l.w+'</small></div><div><b>'+k.s+'</b><small>'+l.s+'</small></div></div>'+
      '<p class="verdict">'+esc(v)+'</p><p><small>'+esc(l.guide)+'</small></p>';
  }
  document.addEventListener("click",function(e){
    var b=e.target.closest(".opts button");
    if(b&&!st.done){var i=+b.dataset.i,j=+b.dataset.j;if(st.inst&&st.a[i]!==undefined)return;if(st.a[i]===j)delete st.a[i];else st.a[i]=j;save();
      if(st.inst){drawQs()}else{b.parentNode.querySelectorAll("button").forEach(function(x){x.setAttribute("aria-pressed",x===b&&st.a[i]===j)});drawBar()}return}
    var m=e.target.closest("[data-m]");if(m){med=m.dataset.m;ls("sul_med",med);drawAll();return}
    var t=e.target.closest("[data-t]");if(t){tn=+t.dataset.t;history.replaceState(null,"","?t="+tn+"&from="+from);drawAll(true);return}
  });
  $("submit").onclick=$("submit2").onclick=function(){finish(false)};
  $("reset").onclick=function(){st={a:{},done:false,left:3000,inst:st.inst};save();drawAll(true);window.scrollTo(0,0)};
  function drawAll(reload){if(reload!==false&&reload)load();drawHead();drawQs();drawResult();startTimer()}
  load();drawAll(false);
})();
</script>
</body>
</html>
