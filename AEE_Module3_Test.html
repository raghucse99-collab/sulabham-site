<style>
:root{--ink:#16324a;--paper:#f6f8f9;--card:#fff;--line:#d6dfe5;--muted:#52677a;--pasupu:#e3a400;--pasupu-soft:#fff3cf;--leaf:#1f7a55;--leaf-soft:#e3f3ea;--kumkum:#b3322b;--kumkum-soft:#fbe9e7;--chain:#2c6e8f;

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#e6eef4;--paper:#0f1a23;--card:#16242f;--line:#29404f;--muted:#9fb3c2;--pasupu:#f2bd2f;--pasupu-soft:#3a2f0e;--leaf:#4cc28c;--leaf-soft:#123326;--kumkum:#ef7a72;--kumkum-soft:#3a1d1b;--chain:#7cc3e0;color-scheme:dark}}

*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.6 var(--f-body)}
.wrap{max-width:820px;margin:0 auto;padding:0 16px}
header{background:var(--card);border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;gap:12px;padding-block:10px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:800;font-size:1.25rem;text-decoration:none;color:var(--ink)}
.brand span{color:var(--pasupu)}
.back{margin-left:auto;font-size:.88rem;color:var(--muted)}
h1{font-family:var(--f-display);font-size:1.6rem;line-height:1.25;margin:20px 0 4px}
.sub{color:var(--muted);margin:0 0 14px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:10px 0}
.seg{display:inline-flex;border:1.5px solid var(--ink);border-radius:999px;overflow:hidden}
.seg button{font:inherit;font-size:.9rem;font-weight:600;padding:7px 14px;border:0;background:transparent;color:var(--ink);cursor:pointer;min-height:40px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.info{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:12px 0;font-size:.92rem}
.info b{font-weight:600}
.info p{margin:4px 0}
label.chk{display:flex;gap:8px;align-items:center;font-size:.92rem;cursor:pointer}
label.chk input{width:18px;height:18px}
.bar{position:sticky;top:0;z-index:4;background:var(--card);border-bottom:1px solid var(--line);box-shadow:0 2px 8px rgba(0,0,0,.05)}
.bar .wrap{display:flex;align-items:center;gap:12px;padding-block:8px}
.prog{flex:1;min-width:0}
.prog small{display:block;color:var(--muted);font-size:.8rem}
.meter{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:4px}
.meter i{display:block;height:100%;background:var(--pasupu);width:0}
.timer{font-variant-numeric:tabular-nums;font-weight:600;font-size:.95rem;white-space:nowrap}
.timer.low{color:var(--kumkum)}
.btn{font:inherit;font-weight:600;border-radius:10px;padding:9px 16px;border:1.5px solid var(--ink);background:var(--card);color:var(--ink);cursor:pointer;min-height:42px;text-decoration:none;display:inline-flex;align-items:center}
.btn.primary{background:var(--pasupu);border-color:var(--pasupu);color:#1b1300}
ol.qs{list-style:none;margin:16px 0;padding:0;display:grid;gap:12px}
.q{scroll-margin-top:90px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.q .qt{margin:0 0 10px}
.q .qt>span.qn{color:var(--muted);margin-right:6px}
.q .qt .l0{font-weight:600;display:inline!important}.q .qt span:not(.qn){display:block}
.q .qt .li,.q .qt .la,.q .qt .lh,.q .qt .lc{font-weight:400;margin-top:4px}
.q .qt .li{padding-left:10px}.q .qt .lh{font-weight:600;margin-top:8px;color:var(--chain)}
.q .qt .la{padding:6px 10px;background:var(--paper);border-radius:8px}
.q .qt .lc{font-weight:600;margin-top:8px}
.opts{display:grid;gap:8px;grid-template-columns:1fr 1fr}
@media (max-width:560px){.opts{grid-template-columns:1fr}}
.opts button{font:inherit;text-align:left;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer;min-height:44px;display:flex;gap:8px}
.opts button b{flex:none;font-weight:600;color:var(--muted)}
.opts button[aria-pressed="true"]{border-color:var(--ink);background:var(--pasupu-soft)}
.opts button.right{border-color:var(--leaf);background:var(--leaf-soft)}
.opts button.wrong{border-color:var(--kumkum);background:var(--kumkum-soft)}
.opts button:disabled{cursor:default}
.why{margin:10px 0 0;padding:8px 12px;border-left:4px solid var(--leaf);background:var(--leaf-soft);border-radius:6px;font-size:.92rem}
.why.no{border-color:var(--kumkum);background:var(--kumkum-soft)}
.why.skip{border-color:var(--muted);background:var(--paper)}
.result{scroll-margin-top:90px;background:var(--card);border:2px solid var(--ink);border-radius:14px;padding:16px;margin:16px 0}
.result h2{font-family:var(--f-display);margin:0 0 8px;font-size:1.3rem}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}
@media (max-width:480px){.stats{grid-template-columns:repeat(2,1fr)}}
.stats div{background:var(--paper);border-radius:10px;padding:8px;text-align:center}
.stats b{display:block;font-size:1.4rem;font-family:var(--f-display)}
.stats small{color:var(--muted);font-size:.8rem}
.verdict{font-weight:600;margin:6px 0}
footer{color:var(--muted);font-size:.85rem;padding:24px 0 40px}
[hidden]{display:none!important}
</style>

I with List-II:","List-I","A. Isogonic line","B. Agonic line","C. Isoclinic line","D. Aclinic line","List-II","1. Zero dip","2. Equal declination","3. Equal dip","4. Zero declination"],"o":[["A-3, B-1, C-2, D-4","A-3, B-1, C-2, D-4"],["A-2, B-1, C-3, D-4","A-2, B-1, C-3, D-4"],["A-2, B-4, C-3, D-1","A-2, B-4, C-3, D-1"],["A-4, B-2, C-1, D-3","A-4, B-2, C-1, D-3"]],"sec":"C. Compass Surveying","a":2,"xe":"'Gonic' goes with declination: isogonic = equal, agonic = zero. 'Clinic' goes with dip (inclination): isoclinic = equal, aclinic = zero.","xt":"'Gonic' goes with declination: isogonic = equal, agonic = zero. 'Clinic' goes with dip (inclination): isoclinic = equal, aclinic = zero."},{"n":15,"en":["Assertion (A): In a prismatic compass, sighting the object and reading the bearing are done together from one position.","Reason (R): The graduated ring of a prismatic compass is fixed to the box and turns with the line of sight."],"te":["Assertion (A): In a prismatic compass, sighting the object and reading the bearing are done together from one position.","Reason (R): The graduated ring of a prismatic compass is fixed to the box and turns with the line of sight."],"o":[["Both A and R are true and R is the correct explanation of A","Both A and R are true and R is the correct explanation of A"],["Both A and R are true, but R is not the correct explanation of A","Both A and R are true, but R is not the correct explanation of A"],["A is true, but R is false","A is true, but R is false"],["Both A and R are false","Both A and R are false"]],"sec":"C. Compass Surveying","a":2,"xe":"A is true (the prism lets the observer read while sighting). R is false: in a prismatic compass the ring is attached to the needle and stays still; a ring fixed to the box is the surveyor's compass.","xt":"A is true (the prism lets the observer read while sighting). R is false: in a prismatic compass the ring is attached to the needle and stays still; a ring fixed to the box is the surveyor's compass. south), ΔE = +100 m (east) → reduced bearing S 45° E → WCB = 180° − 45° = 135°. Fix the quadrant from the signs before using tan.","xt":"ΔN = −100 m (south), ΔE = +100 m (east) → reduced bearing S 45° E → WCB = 180° − 45° = 135°. Fix the quadrant from the signs before using tan."},{"n":19,"en":["Consider the following statements:","I. In a closed traverse the algebraic sum of the deflection angles is 360°.","II. The sum of the exterior angles of a closed traverse of n sides is (2n + 4) × 90°.","III. In an open traverse the closing error is found from the sums of latitudes and departures.","IV. The transit rule is used when the angular measurements are more precise than the linear measurements.","Which of the above statements are correct?"],"te":["Consider the following statements:","I. In a closed traverse the algebraic sum of the deflection angles is 360°.","II. The sum of the exterior angles of a closed traverse of n sides is (2n + 4) × 90°.","III. In an open traverse the closing error is found from the sums of latitudes and departures.","IV. The transit rule is used when the angular measurements are more precise than the linear measurements.","Which of the above statements are correct?"],"o":[["I and II only","I and II only"],["I, II and IV only","I, II and IV only"],["II, III and IV only","II, III and IV only"],["I, II, III and IV","I, II, III and IV"]],"sec":"D. Theodolite, Traversing and Coordinates","a":1,"xe":"III is false: an open traverse does not return to a known point, so it has no closing error and no such check. The other three are standard results.","xt":"III is false: an open traverse does not return to a known point, so it has no closing error and no such check. The other three are standard results."},{"n":20,"en":["Turning the telescope of a theodolite about its horizontal axis through 180° in the vertical plane is called:"],"te":["Turning the telescope of a theodolite about its horizontal axis through 180° in the vertical plane is called:"],"o":[["swinging the telescope","swinging the telescope"],["transiting the telescope","transiting the telescope"],["centring","centring"],["changing face","changing face"]],"sec":"D. Theodolite, Traversing and Coordinates","a":1,"xe":"Transiting (plunging, reversing) is rotation about the horizontal axis. Swinging is rotation about the vertical axis. Changing face needs both: transit, then swing through 180°.","xt":"Transiting (plunging, reversing) is rotation about the horizontal axis. Swinging is rotation about the vertical axis. Changing face needs both: transit, then swing through 180°."},{"n":21,"en":["Study the statement and the conclusions and select the most appropriate option.","Statement: A horizontal angle is measured with a transit theodolite on both faces, reading both verniers.","Conclusion 1: The error due to eccentricity of the verniers is eliminated by reading both verniers.","Conclusion 2: The error due to the vertical axis not being truly vertical is eliminated by taking both-face observations."],"te":["Study the statement and the conclusions and select the most appropriate option.","Statement: A horizontal angle is measured with a transit theodolite on both faces, reading both verniers.","Conclusion 1: The error due to eccentricity of the verniers is eliminated by reading both verniers.","Conclusion 2: The error due to the vertical axis not being truly vertical is eliminated by taking both-face observations."],"o":[["Only conclusion 1 is correct","Only conclusion 1 is correct"],["Only conclusion 2 is correct","Only conclusion 2 is correct"],["Both conclusions 1 and 2 are correct","Both conclusions 1 and 2 are correct"],["Neither conclusion 1 nor 2 is correct","Neither conclusion 1 nor 2 is correct"]],"sec":"D. Theodolite, Traversing and Coordinates","a":0,"xe":"Reading both verniers removes eccentricity. Both-face readings remove collimation and horizontal-axis errors, but not the error of a vertical axis that is not truly vertical — only careful levelling does.","xt":"Reading both verniers removes eccentricity. Both-face readings remove collimation and horizontal-axis errors, but not the error of a vertical axis that is not truly vertical — only careful levelling does."},{"n":22,"en":["From one set-up of a level the staff readings were 1.250 m on a bench mark of RL 50.000 m, then 1.875 m, and finally 0.940 m on point C. The RL of C is:"],"te":["From one set-up of a level the staff readings were 1.250 m on a bench mark of RL 50.000 m, then 1.875 m, and finally 0.940 m on point C. The RL of C is:"],"o":[["50.310 m","50.310 m"],["49.690 m","49.690 m"],["50.935 m","50.935 m"],["51.250 m","51.250 m"]],"sec":"E. Levelling","a":0,"xe":"HI = 50.000 + 1.250 = 51.250 m. RL of C = 51.250 − 0.940 = 50.310 m. The middle reading is an intermediate sight and does not affect C.","xt":"HI = 50.000 + 1.250 = 51.250 m. RL of C = 51.250 − 0.940 = 50.310 m. The middle reading is an intermediate sight and does not affect C."},{"n":23,"en":["The back sight on a bench mark of RL 100.000 m is 1.500 m. The staff is then held inverted against the underside of a beam and reads 2.500 m. The RL of the underside of the beam is:"],"te":["The back sight on a bench mark of RL 100.000 m is 1.500 m. The staff is then held inverted against the underside of a beam and reads 2.500 m. The RL of the underside of the beam is:"],"o":[["99.000 m","99.000 m"],["101.500 m","101.500 m"],["103.000 m","103.000 m"],["104.000 m","104.000 m"]],"sec":"E. Levelling","a":3,"xe":"HI = 101.500 m. An inverted staff reading is negative, so RL = HI − (−2.500) = 104.000 m: the beam is above the line of sight.","xt":"HI = 101.500 m. An inverted staff reading is negative, so RL = HI − (−2.500) = 104.000 m: the beam is above the line of sight."},{"n":24,"en":["In a levelling operation ΣBS = 6.520 m and ΣFS = 4.870 m. If the RL of the first point is 150.000 m, the RL of the last point is:"],"te":["In a levelling operation ΣBS = 6.520 m and ΣFS = 4.870 m. If the RL of the first point is 150.000 m, the RL of the last point is:"],"o":[["148.350 m","148.350 m"],["151.560 m","151.560 m"],["161.390 m","161.390 m"],["151.650 m","151.650 m"]],"sec":"E. Levelling","a":3,"xe":"Last RL − first RL = ΣBS − ΣFS = 6.520 − 4.870 = +1.650 m → 151.650 m.","xt":"Last RL − first RL = ΣBS − ΣFS = 6.520 − 4.870 = +1.650 m → 151.650 m."},{"n":25,"en":["A lighthouse lamp is 64 m above sea level. An observer's eye on a ship is 9 m above sea level. Using d = 3.855 √h (d in km, h in m), the greatest distance at which the lamp is just visible is about:"],"te":["A lighthouse lamp is 64 m above sea level. An observer's eye on a ship is 9 m above sea level. Using d = 3.855 √h (d in km, h in m), the greatest distance at which the lamp is just visible is about:"],"o":[["42.4 km","42.4 km"],["32.9 km","32.9 km"],["30.8 km","30.8 km"],["11.6 km","11.6 km"]],"sec":"E. Levelling","a":0,"xe":"Add the two horizon distances: 3.855(√64 + √9) = 3.855 × 11 = 42.4 km. (32.9 km wrongly uses √(64 + 9).)","xt":"Add the two horizon distances: 3.855(√64 + √9) = 3.855 × 11 = 42.4 km. (32.9 km wrongly uses √(64 + 9).)"},{"n":26,"en":["A staff is held 100 m from a level. When the bubble is moved through 5 divisions, the staff reading changes by 0.050 m. The angular value of one division of the bubble tube is about (1 radian = 206,265″):"],"te":["A staff is held 100 m from a level. When the bubble is moved through 5 divisions, the staff reading changes by 0.050 m. The angular value of one division of the bubble tube is about (1 radian = 206,265″):"],"o":[["10.3″","10.3″"],["20.6″","20.6″"],["41.2″","41.2″"],["103″","103″"]],"sec":"E. Levelling","a":1,"xe":"α = s/(nD) = 0.05/(5 × 100) = 1 × 10⁻⁴ rad = 20.6″. A smaller value per division means a more sensitive tube.","xt":"α = s/(nD) = 0.05/(5 × 100) = 1 × 10⁻⁴ rad = 20.6″. A smaller value per division means a more sensitive tube."},{"n":27,"en":["Match List-I (type of levelling) with List-II (description):","List-I","A. Barometric levelling","B. Trigonometric levelling","C. Reciprocal levelling","D. Profile levelling","List-II","1. Levels at short intervals along a fixed line","2. Difference of atmospheric pressure","3. Level set up near each of two points on opposite banks","4. Vertical angles and measured distances"],"te":["Match List-I (type of levelling) with List-II (description):","List-I","A. Barometric levelling","B. Trigonometric levelling","C. Reciprocal levelling","D. Profile levelling","List-II","1. Levels at short intervals along a fixed line","2. Difference of atmospheric pressure","3. Level set up near each of two points on opposite banks","4. Vertical angles and measured distances"],"o":[["A-4, B-2, C-3, D-1","A-4, B-2, C-3, D-1"],["A-2, B-4, C-1, D-3","A-2, B-4, C-1, D-3"],["A-2, B-4, C-3, D-1","A-2, B-4, C-3, D-1"],["A-2, B-3, C-4, D-1","A-2, B-3, C-4, D-1"]],"sec":"E. Levelling","a":2,"xe":"The same idea as 2023 Q132: barometric → pressure; trigonometric → vertical angles and distances; reciprocal → both banks; profile → along a fixed line.","xt":"The same idea as 2023 Q132: barometric → pressure; trigonometric → vertical angles and distances; reciprocal → both banks; profile → along a fixed line."},{"n":28,"en":["Assertion (A): Even if the line of collimation of a level is inclined, the difference of level between two points is correct when the back-sight and fore-sight distances are equal.","Reason (R): The errors in the two staff readings are then equal and cancel when one reading is subtracted from the other."],"te":["Assertion (A): Even if the line of collimation of a level is inclined, the difference of level between two points is correct when the back-sight and fore-sight distances are equal.","Reason (R): The errors in the two staff readings are then equal and cancel when one reading is subtracted from the other."],"o":[["Both A and R are true and R is the correct explanation of A","Both A and R are true and R is the correct explanation of A"],["Both A and R are true, but R is not the correct explanation of A","Both A and R are true, but R is not the correct explanation of A"],["A is true, but R is false","A is true, but R is false"],["Both A and R are false","Both A and R are false"]],"sec":"E. Levelling","a":0,"xe":"Collimation error is proportional to distance. With equal distances both readings are wrong by the same amount, so their difference is right. Curvature and refraction cancel in the same way.","xt":"Collimation error is proportional to distance. With equal distances both readings are wrong by the same amount, so their difference is right. Curvature and refraction cancel in the same way."},{"n":29,"en":["A road is to be aligned at a ruling gradient of 1 in 40 on a contour map of scale 1 cm = 20 m with a contour interval of 2 m. The distance to be stepped off on the map between successive contours is:"],"te":["A road is to be aligned at a ruling gradient of 1 in 40 on a contour map of scale 1 cm = 20 m with a contour interval of 2 m. The distance to be stepped off on the map between successive contours is:"],"o":[["8 cm","8 cm"],["2 cm","2 cm"],["0.4 cm","0.4 cm"],["4 cm","4 cm"]],"sec":"F. Contours and Digital Elevation Modelling","a":3,"xe":"Horizontal distance for a 2 m rise at 1 in 40 = 80 m. On the map, 80/20 = 4 cm. This is how a contour gradient is traced.","xt":"Horizontal distance for a 2 m rise at 1 in 40 = 80 m. On the map, 80/20 = 4 cm. This is how a contour gradient is traced."},{"n":30,"en":["Study the statement and the conclusions and select the most appropriate option.","Statement: On a contour map, the 100 m, 105 m and 110 m contours are found to merge into a single line over a short length.","Conclusion 1: The ground at that place is a vertical cliff.","Conclusion 2: The contour interval of the map changes at that place."],"te":["Study the statement and the conclusions and select the most appropriate option.","Statement: On a contour map, the 100 m, 105 m and 110 m contours are found to merge into a single line over a short length.","Conclusion 1: The ground at that place is a vertical cliff.","Conclusion 2: The contour interval of the map changes at that place."],"o":[["Only conclusion 1 is correct","Only conclusion 1 is correct"],["Only conclusion 2 is correct","Only conclusion 2 is correct"],["Both conclusions 1 and 2 are correct","Both conclusions 1 and 2 are correct"],["Neither conclusion 1 nor 2 is correct","Neither conclusion 1 nor 2 is correct"]],"sec":"F. Contours and Digital Elevation Modelling","a":0,"xe":"Contours of different values join only where the ground is vertical. The contour interval stays constant over the whole map.","xt":"Contours of different values join only where the ground is vertical. The contour interval stays constant over the whole map."},{"n":31,"en":["Which of the following statements is INCORRECT?"],"te":["Which of the following statements is INCORRECT?"],"o":[["The contour interval is kept constant on a map","The contour interval is kept constant on a map"],["Contours cross ridge lines and valley lines at right angles","Contours cross ridge lines and valley lines at right angles"],["Indirect methods of contouring are slower but more accurate than the direct method","Indirect methods of contouring are slower but more accurate than the direct method"],["A TIN represents terrain by a network of triangles","A TIN represents terrain by a network of triangles"]],"sec":"F. Contours and Digital Elevation Modelling","a":2,"xe":"It is the other way round: the direct method (tracing each contour on the ground) is slower and more accurate; indirect methods (grid, cross-sections, tacheometry) are faster and less accurate.","xt":"It is the other way round: the direct method (tracing each contour on the ground) is slower and more accurate; indirect methods (grid, cross-sections, tacheometry) are faster and less accurate."},{"n":32,"en":["S1: LiDAR is an active remote-sensing technique that can give high-resolution digital elevation models.","S2: In a raster (grid) DEM, elevations are stored at the corners of irregular triangles."],"te":["S1: LiDAR is an active remote-sensing technique that can give high-resolution digital elevation models.","S2: In a raster (grid) DEM, elevations are stored at the corners of irregular triangles."],"o":[["Both S1 and S2 are true","Both S1 and S2 are true"],["S1 is true and S2 is false","S1 is true and S2 is false"],["S1 is false and S2 is true","S1 is false and S2 is true"],["Both S1 and S2 are false","Both S1 and S2 are false"]],"sec":"F. Contours and Digital Elevation Modelling","a":1,"xe":"S1 is true: LiDAR sends its own laser pulses. S2 describes a TIN; a raster DEM stores one elevation per square cell of a regular grid.","xt":"S1 is true: LiDAR sends its own laser pulses. S2 describes a TIN; a raster DEM stores one elevation per square cell of a regular grid."},{"n":33,"en":["With a tacheometer, a staff held at 50 m gave an intercept of 0.495 m, and at 100 m an intercept of 0.995 m (horizontal sights). The multiplying and additive constants are:"],"te":["With a tacheometer, a staff held at 50 m gave an intercept of 0.495 m, and at 100 m an intercept of 0.995 m (horizontal sights). The multiplying and additive constants are:"],"o":[["k = 100, C = 0","k = 100, C = 0"],["k = 100, C = 0.5 m","k = 100, C = 0.5 m"],["k = 101, C = 0.5 m","k = 101, C = 0.5 m"],["k = 99, C = 1.0 m","k = 99, C = 1.0 m"]],"sec":"G. Tacheometry, EDM and Total Station","a":1,"xe":"D = ks + C. Subtract: 50 = k × 0.5 → k = 100. Then 50 = 100 × 0.495 + C → C = 0.5 m. An anallactic lens would make C zero.","xt":"D = ks + C. Subtract: 50 = k × 0.5 → k = 100. Then 50 = 100 × 0.495 + C → C = 0.5 m. An anallactic lens would make C zero."},{"n":34,"en":["A tacheometer (k = 100, C = 0) reads a staff intercept of 1.0 m on a vertical staff with the line of sight inclined at 30° to the horizontal. The vertical component V is:"],"te":["A tacheometer (k = 100, C = 0) reads a staff intercept of 1.0 m on a vertical staff with the line of sight inclined at 30° to the horizontal. The vertical component V is:"],"o":[["86.6 m","86.6 m"],["75.0 m","75.0 m"],["43.3 m","43.3 m"],["50.0 m","50.0 m"]],"sec":"G. Tacheometry, EDM and Total Station","a":2,"xe":"V = ks sin 2θ / 2 = 100 × 1 × sin 60°/2 = 43.3 m. (75 m is the horizontal distance ks cos²θ; 86.6 m forgets the division by 2.)","xt":"V = ks sin 2θ / 2 = 100 × 1 × sin 60°/2 = 43.3 m. (75 m is the horizontal distance ks cos²θ; 86.6 m forgets the division by 2.)"},{"n":35,"en":["A subtense bar 2 m long subtends a horizontal angle of 4125″ at the theodolite (1 radian = 206,265″). The horizontal distance to the bar is:"],"te":["A subtense bar 2 m long subtends a horizontal angle of 4125″ at the theodolite (1 radian = 206,265″). The horizontal distance to the bar is:"],"o":[["200 m","200 m"],["50 m","50 m"],["412.5 m","412.5 m"],["100 m","100 m"]],"sec":"G. Tacheometry, EDM and Total Station","a":3,"xe":"α = 4125/206,265 = 0.02 rad. D = b/α = 2/0.02 = 100 m.","xt":"α = 4125/206,265 = 0.02 rad. D = b/α = 2/0.02 = 100 m."},{"n":36,"en":["Match List-I with List-II:","List-I","A. Tellurometer","B. Geodimeter","C. Distomat","D. Total station","List-II","1. Infrared waves","2. Microwaves","3. Electronic theodolite, EDM and microprocessor together","4. Visible light"],"te":["Match List-I with List-II:","List-I","A. Tellurometer","B. Geodimeter","C. Distomat","D. Total station","List-II","1. Infrared waves","2. Microwaves","3. Electronic theodolite, EDM and microprocessor together","4. Visible light"],"o":[["A-2, B-4, C-1, D-3","A-2, B-4, C-1, D-3"],["A-4, B-2, C-1, D-3","A-4, B-2, C-1, D-3"],["A-2, B-1, C-4, D-3","A-2, B-1, C-4, D-3"],["A-1, B-4, C-2, D-3","A-1, B-4, C-2, D-3"]],"sec":"G. Tacheometry, EDM and Total Station","a":0,"xe":"Tellurometer → microwaves (long range); Geodimeter → visible light; Distomat → infrared (short range, as in total stations).","xt":"Tellurometer → microwaves (long range); Geodimeter → visible light; Distomat     r.hidden=false;r.innerHTML='<h2>'+esc(l.res)+' · '+esc(l.title(tn))+'</h2>'+(auto?'<p>'+esc(l.time)+'</p>':'')+
      '<div class="stats"><div><b>'+k.m+'</b><small>'+l.m+' / 50</small></div><div><b>'+k.c+'</b><small>'+l.c+'</small></div><div><b>'+k.w+'</b><small>'+l.w+'</small></div><div><b>'+k.s+'</b><small>'+l.s+'</small></div></div>'+
      '<p class="verdict">'+esc(v)+'</p><p><small>'+esc(l.guide)+'</small></p>';
  }
  document.addEventListener("click",function(e){
    var b=e.target.closest(".opts button");
    if(b&&!st.done){var i=+b.dataset.i,j=+b.dataset.j;if(st.inst&&st.a[i]!==undefined)return;if(st.a[i]===j)delete st.a[i];else st.a[i]=j;save();
      if(st.inst){drawQs()}else{b.parentNode.querySelectorAll("button").forEach(function(x){x.setAttribute("aria-pressed",x===b&&st.a[i]===j)});drawBar()}return}
    var m=e.target.closest("[data-m]");if(m){med=m.dataset.m;ls("sul_med",med);drawAll();return}
    var t=e.target.closest("[data-t]");if(t){tn=+t.dataset.t;history.replaceState(null,"","?t="+tn+"&from="+from);drawAll(true);return}
  });
  $("submit").onclick=$("submit2").onclick=function(){finish(false)};
  $("reset").onclick=function(){st={a:{},done:false,left:3000,inst:st.inst};save();drawAll(true);window.scrollTo(0,0)};
  function drawAll(reload){if(reload!==false&&reload)load();drawHead();drawQs();drawResult();startTimer()}
  load();drawAll(false);
})();
</script>
</body>
</html>
