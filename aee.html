var b64=function(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0)})},IDX=null;
function norm(c){return String(c||"").toUpperCase().replace(/[^A-Z0-9]/g,"")}
function idx(){return IDX?Promise.resolve(IDX):fetch("ak/index.json",{cache:"no-cache"}).then(function(r){return r.json()}).then(function(j){IDX=j;return j})}
function valid(code){return idx().then(function(I){return crypto.subtle.importKey("raw",new TextEncoder().encode(norm(code)),"PBKDF2",false,["deriveKey"]).then(function(k){
   return crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(I.salt),iterations:I.iter,hash:"SHA-256"},k,{name:"AES-GCM",length:256},false,["decrypt"])}).then(function(k){var c=b64(I.check);
   return crypto.subtle.decrypt({name:"AES-GCM",iv:c.slice(0,12)},k,c.slice(12))})})}
