<!doctype html>
<html lang="en">
<head>
<script src="migrate.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sulabham App · Install on your phone</title>
<meta name="description" content="Install the Sulabham app on your phone — APPSC Group 1 & 2 preparation in Telugu and English. Free, no Play Store needed, opens like an app.">
<link rel="canonical" href="https://sulabham.in/app.html">
<link rel="icon" type="image/svg+xml" href="sulabham-icon.svg">
<script src="devcode.js"></script>
<style>
body{margin:0;background:#f6f4ee;color:#14212b;font:16px/1.55 "Noto Sans","Noto Sans Telugu",sans-serif}
header{background:#1d4f91;color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center}
header a{color:#fff;text-decoration:none;font-weight:800;font-size:20px}
.lg button{background:transparent;border:1px solid #fff;color:#fff;border-radius:8px;padding:4px 10px;margin-left:4px;font:inherit;font-size:.9rem}
.lg button.on{background:#fff;color:#1d4f91}
main{max-width:640px;margin:0 auto;padding:16px}
.hero{background:linear-gradient(135deg,#0c2238,#1d4f91);color:#fff;border-radius:18px;padding:20px;display:flex;gap:16px;align-items:center}
.hero img{width:72px;height:72px;border-radius:16px;flex:none}.hero h1{margin:0 0 4px;font-size:1.45rem;line-height:1.2}.hero p{margin:0;opacity:.9}
.btn{display:block;width:100%;box-sizing:border-box;text-align:center;background:#e3a400;color:#1b1500;font-weight:800;font-size:1.1rem;border:0;border-radius:12px;padding:14px;margin:16px 0 4px;text-decoration:none;font-family:inherit}
.box{background:#fff;border:1px solid #dfe3e6;border-radius:14px;padding:14px 16px;margin:14px 0}
.box h2{margin:0 0 8px;font-size:1.1rem}.box ol{margin:0;padding-left:22px}.box li{margin:4px 0}
.ok{background:#e8f5e8;border-color:#9fd09f}.note{color:#5b6b78;font-size:.92rem}
.dev{background:#fff3cf;border:1px dashed #e3a400;border-radius:10px;padding:9px 12px}.dev b{font-family:monospace;font-size:1.1rem}
ul.f{margin:0;padding-left:20px}
</style>
</head>
<body>
<header><a href="index.html">సులభం</a><span class="lg"><button id="lte">తెలుగు</button><button id="len">English</button></span></header>
<main id="m"></main>
<script>
(function(){
var L={en:{t:"Sulabham App",s:"APPSC Group 1 & 2 in Telugu and English — on your home screen",
 inst:"📲 Install the app",done:"✅ Sulabham app is installed on this phone. Open it from your home screen.",
 why:"Why install?",f:["Opens in one tap from your home screen, full screen like an app","Daily current affairs, quizzes, mock tests and your packs in one place","Pages you have opened still read when the net is weak","Free — no Play Store download, very small (under 1 MB)"],
 an:"Android (Chrome)",anS:["Open sulabham.in in <b>Chrome</b>","Tap the <b>Install the app</b> button above — or tap Chrome's menu <b>⋮</b> → <b>Install app</b> / <b>Add to Home screen</b>","Tap <b>Install</b>. The Sulabham icon appears on your home screen"],
 ip:"iPhone (Safari)",ipS:["Open sulabham.in in <b>Safari</b>","Tap the <b>Share</b> button (square with ↑ arrow)","Tap <b>Add to Home Screen</b> → <b>Add</b>"],
 paid:"Bought a pack?",paidT:"On Android the app keeps your unlock — nothing to do. On iPhone the home-screen app is separate from Safari: open the pack inside the app, and if it asks for a code, send us the device number shown there — we send a new code free.",
 dv:"Device number in this window",
 nob:"No install button? Then the app is <b>already installed</b> on this phone — look for the <b>Sulabham</b> icon on your home screen or in the apps list. Or tap Chrome's menu <b>⋮</b> → <b>Install app</b>."},
 te:{t:"సులభం యాప్",s:"APPSC గ్రూప్ 1 & 2 తెలుగు, ఇంగ్లీష్‌లో — మీ ఫోన్ హోమ్ స్క్రీన్‌పై",
 inst:"📲 యాప్ ఇన్‌స్టాల్ చేయండి",done:"✅ సులభం యాప్ ఈ ఫోన్‌లో ఇన్‌స్టాల్ అయింది. హోమ్ స్క్రీన్ నుంచి తెరవండి.",
 why:"ఎందుకు ఇన్‌స్టాల్ చేయాలి?",f:["హోమ్ స్క్రీన్ నుంచి ఒక్క టచ్‌తో, యాప్ లాగా పూర్తి స్క్రీన్‌లో తెరుచుకుంటుంది","రోజువారీ కరెంట్ అఫైర్స్, క్విజ్‌లు, మాక్ టెస్ట్‌లు, మీ ప్యాక్‌లు — అన్నీ ఒకే చోట","నెట్ బలహీనంగా ఉన్నా ముందు తెరిచిన పేజీలు చదవవచ్చు","ఉచితం — ప్లే స్టోర్ అవసరం లేదు, చాలా చిన్నది (1 MB కంటే తక్కువ)"],
 an:"ఆండ్రాయిడ్ (Chrome)",anS:["sulabham.in ను <b>Chrome</b>లో తెరవండి","పైన ఉన్న <b>యాప్ ఇన్‌స్టాల్ చేయండి</b> బటన్ నొక్కండి — లేదా Chrome మెనూ <b>⋮</b> → <b>Install app</b> / <b>Add to Home screen</b>","<b>Install</b> నొక్కండి. సులభం ఐకాన్ హోమ్ స్క్రీన్‌పై వస్తుంది"],
 ip:"ఐఫోన్ (Safari)",ipS:["sulabham.in ను <b>Safari</b>లో తెరవండి","<b>Share</b> బటన్ (↑ బాణం ఉన్న చతురస్రం) నొక్కండి","<b>Add to Home Screen</b> → <b>Add</b> నొక్కండి"],
 paid:"ప్యాక్ కొన్నారా?",paidT:"ఆండ్రాయిడ్‌లో యాప్‌లో కూడా మీ అన్‌లాక్ అలాగే ఉంటుంది — ఏమీ చేయనక్కర్లేదు. ఐఫోన్‌లో హోమ్ స్క్రీన్ యాప్ Safari నుంచి వేరు: యాప్‌లో ప్యాక్ తెరవండి, కోడ్ అడిగితే అక్కడ కనిపించే పరికరం నంబర్ మాకు పంపండి — కొత్త కోడ్ ఉచితంగా పంపుతాం.",
 dv:"ఈ విండోలో పరికరం నంబర్",
 nob:"ఇన్‌స్టాల్ బటన్ కనిపించలేదా? అయితే యాప్ ఈ ఫోన్‌లో <b>ఇప్పటికే ఇన్‌స్టాల్ అయింది</b> — హోమ్ స్క్రీన్ లేదా యాప్స్ జాబితాలో <b>Sulabham</b> ఐకాన్ చూడండి. లేదా Chrome మెనూ <b>⋮</b> → <b>Install app</b> నొక్కండి."}};
var lang="en";try{lang=localStorage.getItem("sul_lang")||"en"}catch(e){}
var standalone=(window.matchMedia&&matchMedia("(display-mode: standalone)").matches)||navigator.standalone;
var ios=/iphone|ipad|ipod/i.test(navigator.userAgent);
function li(a){return a.map(function(x){return"<li>"+x+"</li>"}).join("")}
function draw(){var x=L[lang];document.documentElement.lang=lang;document.title=x.t+" · Sulabham";
 document.getElementById("lte").className=lang==="te"?"on":"";document.getElementById("len").className=lang==="en"?"on":"";
 var top=standalone?'<div class="box ok">'+x.done+'</div>':(window.SUL_install?'<button class="btn" id="ib">'+x.inst+'</button>':(ios?'':'<div class="box">'+x.nob+'</div>'));
 var steps=ios?[["ip","ipS"],["an","anS"]]:[["an","anS"],["ip","ipS"]];
 document.getElementById("m").innerHTML='<div class="hero"><img src="icons/icon-192.png" alt=""><div><h1>'+x.t+'</h1><p>'+x.s+'</p></div></div>'+top+
  '<div class="box"><h2>'+x.why+'</h2><ul class="f">'+li(x.f)+'</ul></div>'+
  steps.map(function(p){return'<div class="box"><h2>'+x[p[0]]+'</h2><ol>'+li(x[p[1]])+'</ol></div>'}).join("")+
  '<div class="box"><h2>'+x.paid+'</h2><p style="margin:0 0 10px">'+x.paidT+'</p><div class="dev">'+x.dv+': <b>D-'+SUL_dev.id()+'</b></div></div>';
 var b=document.getElementById("ib");if(b)b.onclick=function(){var p=window.SUL_install;if(!p)return;p.prompt();p.userChoice.then(function(){window.SUL_install=null;draw()})}}
document.getElementById("lte").onclick=function(){lang="te";try{localStorage.setItem("sul_lang",lang)}catch(e){}draw()};
document.getElementById("len").onclick=function(){lang="en";try{localStorage.setItem("sul_lang",lang)}catch(e){}draw()};
document.addEventListener("sul-install",draw);window.addEventListener("appinstalled",function(){standalone=true;draw()});
draw();
})();
</script>
</body></html>
