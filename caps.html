<!doctype html>
<html lang="en">
<head>
<script src="migrate.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Topic Capsules ₹49 · Sulabham</title>
<meta name="description" content="Sulabham topic capsules for APPSC Group 1 & 2: one topic, verified notes linked to all subjects, PDF in Telugu & English and Group-pattern MCQs — ₹49 each.">
<link rel="canonical" href="https://sulabham.in/caps.html">
<link rel="icon" type="image/svg+xml" href="sulabham-icon.svg">
<style>
body{margin:0;background:#f6f4ee;color:#14212b;font:16px/1.55 "Noto Sans","Noto Sans Telugu",sans-serif}
header{background:#2a0b3d;color:#fff;padding:10px 16px;display:flex;justify-content:space-between;align-items:center}
header a{color:#fff;text-decoration:none;font-weight:800;font-size:19px}
.lg button{background:transparent;border:1px solid #fff;color:#fff;border-radius:8px;padding:4px 10px;margin-left:4px;font:inherit;font-size:.88rem;cursor:pointer}.lg button.on{background:#fff;color:#2a0b3d}
main{max-width:760px;margin:0 auto;padding:16px}
.hero{background:linear-gradient(135deg,#2a0b3d,#5b1f7a);color:#fff;border-radius:18px;padding:18px}.hero h1{margin:0 0 6px;font-size:1.5rem}.hero p{margin:0;opacity:.92}
.t{display:flex;gap:14px;align-items:center;background:#fff;border:1px solid #e3d6ec;border-radius:16px;padding:14px;margin:12px 0;text-decoration:none;color:inherit}
.t .ic{font-size:2rem;flex:none}.t b{display:block;font-size:1.08rem;color:#3d1153}.t small{display:block;color:#5b6b78}
.t .pr{margin-left:auto;flex:none;background:#ffd45c;color:#1b1500;font-weight:800;border-radius:12px;padding:8px 12px;text-align:center;line-height:1.2}
.t.soon{opacity:.6;border-style:dashed}
.why{background:#fff3cf;border:1px dashed #e3a400;border-radius:12px;padding:10px 12px;margin:14px 0}.why ul{margin:4px 0;padding-left:20px}
</style>
</head>
<body>
<header><a href="index.html">సులభం</a><span class="lg"><button id="lte">తెలుగు</button><button id="len">English</button></span></header>
<main id="m"></main>
<script>
(function(){
var lang="en";try{lang=localStorage.getItem("sul_lang")||"en"}catch(e){}
var IDX=[],SOON=[{ic:"🤝",en:"Summits, Conferences & Meetings 2026",te:"సదస్సులు, సమావేశాలు 2026"},{ic:"🏅",en:"Awards & Honours 2026",te:"అవార్డులు & పురస్కారాలు 2026"},{ic:"🏟️",en:"Sports 2026",te:"క్రీడలు 2026"}];
var ICON={"indices-2026":"📊"};
function E(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function L(en,te){return lang==="te"?te:en}
function draw(){document.documentElement.lang=lang;document.getElementById("lte").className=lang==="te"?"on":"";document.getElementById("len").className=lang==="en"?"on":"";
 var h='<div class="hero"><h1>💊 '+L("Topic Capsules — ₹49 each","టాపిక్ క్యాప్సూల్స్ — ఒక్కొక్కటి ₹49")+'</h1><p>'+L("One current-affairs topic, finished in one sitting: verified facts, links to every subject, PDF in Telugu & English, and qualified Group-pattern MCQs.","ఒక కరెంట్ అఫైర్స్ అంశం — ఒక్కసారి కూర్చుంటే పూర్తి: నిర్ధారిత వాస్తవాలు, అన్ని సబ్జెక్టులతో అనుసంధానం, తెలుగు & ఇంగ్లీష్ PDF, గ్రూప్ స్థాయి ప్రశ్నలు.")+'</p></div>';
 h+=IDX.map(function(c){return'<a class="t" href="capsule.html?t='+c.id+'"><span class="ic">'+(ICON[c.id]||"💊")+'</span><span><b>'+E(c.title[lang]||c.title.en)+'</b><small>'+c.cards+' '+L("indices","సూచీలు")+' · '+c.mcq+' MCQs · PDF · '+L("updated","నవీకరణ")+' '+E(c.updated)+'</small></span><span class="pr">₹'+c.price+'<br><small style="color:#1b1500">'+L("free preview","ఉచిత నమూనా")+'</small></span></a>'}).join("");
 h+=SOON.map(function(s){return'<div class="t soon"><span class="ic">'+s.ic+'</span><span><b>'+E(s[lang])+'</b><small>'+L("Coming soon","త్వరలో")+'</small></span><span class="pr">₹49</span></div>'}).join("");
 h+='<div class="why"><b>'+L("Why capsules?","క్యాప్సూల్స్ ఎందుకు?")+'</b><ul><li>'+L("Every fact checked with official sources — common coaching mistakes corrected in a 'Traps' box.","ప్రతి వాస్తవం అధికారిక మూలాలతో సరిచూశాం — సాధారణ పొరపాట్లను 'ఉచ్చులు' బాక్సులో సరిదిద్దాం.")+'</li><li>'+L("Each topic is linked to Polity, Economy, Geography, History and Environment — the way APPSC asks.","ప్రతి అంశాన్ని పాలిటీ, ఆర్థికం, భూగోళం, చరిత్ర, పర్యావరణంతో అనుసంధానించాం — APPSC అడిగే విధంగా.")+'</li><li>'+L("Questions in the latest APPSC pattern: statements, match-the-list, assertion–reason, chronology.","తాజా APPSC విధానంలో ప్రశ్నలు: స్టేట్‌మెంట్లు, జతపరచడం, వాదన–కారణం, కాలక్రమం.")+'</li></ul></div>';
 document.getElementById("m").innerHTML=h}
document.getElementById("lte").onclick=function(){lang="te";try{localStorage.setItem("sul_lang",lang)}catch(e){}draw()};
document.getElementById("len").onclick=function(){lang="en";try{localStorage.setItem("sul_lang",lang)}catch(e){}draw()};
fetch("caps/index.json?v="+Date.now()).then(function(r){return r.json()}).then(function(d){IDX=d;draw()}).catch(draw);
})();
</script>
</body></html>
