*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Noto Sans","Noto Sans Telugu",sans-serif}
html[lang=te] body{line-height:1.7}
header{background:#2a0b3d;color:#fff;padding:10px 16px;display:flex;justify-content:space-between;align-items:center;gap:8px;position:sticky;top:0;z-index:5}
header a{color:#fff;text-decoration:none;font-weight:800;font-size:19px}
.lg button{background:transparent;border:1px solid #fff;color:#fff;border-radius:8px;padding:4px 10px;margin-left:4px;font:inherit;font-size:.88rem;cursor:pointer}
.lg button.on{background:#fff;color:#2a0b3d}
main{max-width:760px;margin:0 auto;padding:14px 16px 90px}
.hero{background:linear-gradient(135deg,#2a0b3d,#5b1f7a);color:#fff;border-radius:18px;padding:18px}
.hero .tag{display:inline-block;background:#ffd45c;color:#1b1500;font-weight:800;border-radius:999px;padding:2px 12px;font-size:.82rem}
.hero h1{margin:8px 0 4px;font-size:1.6rem;line-height:1.2}.hero p{margin:0;opacity:.92}
.hero .stats{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.hero .stats span{background:rgba(255,255,255,.14);border-radius:10px;padding:4px 10px;font-size:.88rem}
.btn{display:inline-block;border:0;border-radius:12px;padding:12px 16px;font:inherit;font-weight:800;cursor:pointer;text-decoration:none;text-align:center}
.gold{background:#ffd45c;color:#1b1500}.pri{background:var(--acc);color:#fff}.line{background:#fff;color:var(--ink);border:1px solid var(--line)}.tg{background:#229ed9;color:#fff}.grn{background:#1f8a4c;color:#fff}
.how{background:var(--pasupu-soft);border:1px dashed var(--pasupu);border-radius:12px;padding:10px 12px;margin:14px 0;font-size:.95rem}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;margin:14px 0;overflow:hidden}
.card>h2{margin:0;color:#fff;font-size:1.12rem;padding:10px 14px}
.in{padding:10px 14px}
table{width:100%;border-collapse:collapse;margin:4px 0 8px;font-size:.93rem}td,th{overflow-wrap:anywhere;border:1px solid #e3e7ea;padding:6px 8px;vertical-align:top;text-align:left}
td.k{width:30%;font-weight:600;background:#f8fafb}th{background:#eef2f5}
.box{border-radius:12px;padding:9px 12px;margin:9px 0;font-size:.95rem}.box b.h{display:block;margin-bottom:3px}
.cn{background:#eaf3ff;border-left:5px solid #1d4f91}.ch{background:#eef8ef;border-left:5px solid #2f7a3a}.sj{background:#f6effa;border-left:5px solid #7b3fa0}.tr{background:#fff0ee;border-left:5px solid #b3322b}
.box ul{margin:2px 0;padding-left:20px}.box li{margin:4px 0}
h2.sec{font-size:1.2rem;color:#3d1153;margin:22px 0 8px;border-bottom:3px solid var(--pasupu);padding-bottom:4px}
.mini{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 13px;margin:9px 0;font-size:.94rem}.mini h3{margin:0 0 4px;font-size:1.02rem}.mini div{margin:3px 0}.mini b{color:#3d1153}
.bar{display:flex;align-items:center;gap:8px;margin:5px 0;font-size:.88rem}.bar span{width:44%;flex:none}.bar i{display:block;height:12px;border-radius:4px;background:#b46fd6}.bar em{font-style:normal;font-weight:700;white-space:nowrap}

.ask{font-style:italic;color:var(--mut);margin:4px 0}
.op{display:block;width:100%;text-align:left;background:#f8fafb;border:1px solid #dde3e8;border-radius:10px;padding:9px 11px;margin:6px 0;font:inherit;cursor:pointer;color:var(--ink)}
.op.ok{background:#e3f6e8;border-color:#5cb075}.op.no{background:#fde8e6;border-color:#d9776c}.op[disabled]{cursor:default}
.why{display:none;background:#f3f6ff;border-radius:10px;padding:8px 10px;margin-top:6px;font-size:.93rem}.q.done .why{display:block}
.score{position:fixed;left:0;right:0;bottom:0;background:#2a0b3d;color:#fff;padding:10px 16px;display:flex;justify-content:space-between;align-items:center;gap:8px;z-index:6}
.lock{background:#fff;border:2px solid var(--acc);border-radius:16px;padding:14px;margin:16px 0}

.msg{min-height:1.2em;font-weight:600;margin:6px 0}.bad{color:#b3322b}.good{color:#1f6f4a}
.teaser li{margin:3px 0}
.pdfs{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.note{color:var(--mut);font-size:.9rem}
.q{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}

.upsell{background:linear-gradient(135deg,#ffe7a3,#f2b43c);border-radius:12px;padding:10px 12px;margin:10px 0;color:#2a1a00}.upsell a{color:#2a1a00;font-weight:800}
</style>

function tryCode(typed,user,isMaster){var msg=$("msg");if(msg&&user){msg.className="msg";msg.textContent=L("Checking…","పరిశీలిస్తున్నాం…")}
 return (isMaster?Promise.resolve(norm(typed)):SUL_dev.resolve(typed,"cap-"+id)).then(function(master){if(!master)throw 0;return keyOf(master).then(function(k){return dec(k,b64(D.check)).then(function(){KEY=k;ls("sul_cap_"+id,norm(master));return dec(k,b64(D.enc))})})})
 .then(function(buf){FULL=JSON.parse(new TextDecoder().decode(buf));ANS={};draw();window.scrollTo(0,0)})
 .catch(function(){if(msg&&user){msg.className="msg bad";msg.textContent=L("This code is not correct for this device. Check it, or send us your device number.","ఈ పరికరానికి ఈ కోడ్ సరికాదు. సరిచూడండి, లేదా మీ పరికరం నంబర్ పంపండి.")}})}
function getPdf(m,b){if(!KEY)return;var old=b.textContent;b.textContent="⏳";
 fetch(D.pdf[m].file).then(function(r){return r.arrayBuffer()}).then(function(a){return dec(KEY,new Uint8Array(a))}).then(function(buf){
  var u=URL.createObjectURL(new Blob([buf],{type:"application/pdf"})),a=document.createElement("a");a.href=u;a.download="Sulabham_"+id+"_"+m.toUpperCase()+".pdf";document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u)},4000);b.textContent=old})
 .catch(function(){b.textContent=old})}
$("lte").onclick=function(){lang="te";ls("sul_lang",lang);if(D)draw()};$("len").onclick=function(){lang="en";ls("sul_lang",lang);if(D)draw()};
fetch("caps/"+id+".json").then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(d){D=d;draw();
 var saved=ls("sul_cap_"+id);var u=(location.hash.match(/code=([A-Za-z0-9-]+)/)||[])[1];
 if(u){history.replaceState(null,"",location.pathname+location.search);tryCode(u,true)}else if(saved)tryCode(saved,false,true)})
 .catch(function(){$("m").innerHTML='<p>'+L("Capsule not found.","క్యాప్సూల్ దొరకలేదు.")+' <a href="caps.html">'+L("See all capsules","అన్ని క్యాప్సూల్స్")+'</a></p>'});
})();
