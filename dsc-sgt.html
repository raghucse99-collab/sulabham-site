.btn.w{background:#fff;color:#16324a}
.btn.o{background:transparent;color:inherit;border:2px solid currentColor}

.wk.on{border-color:var(--leaf);box-shadow:inset 4px 0 0 var(--leaf)}
@media(max-width:560px){.wk{grid-template-columns:1fr auto}.wk .d{grid-column:1/-1}}
.lg{font-size:1rem;margin:16px 0 8px;color:var(--muted);font-weight:800}

.li{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-height:52px;text-decoration:none;color:var(--ink);font-weight:600;font-size:.95rem}

.li.s{opacity:.62;font-weight:500}.li.f{border-color:var(--leaf)}
.lt{font-style:normal;flex:none;font-size:.72rem;font-weight:800;border-radius:999px;padding:3px 9px;white-space:nowrap}
.lt.f{background:var(--leaf-soft);color:var(--leaf)}.lt.l{background:var(--pasupu-soft);color:#8a5a00}.lt.s{background:var(--paper);color:var(--muted);border:1px solid var(--line)}

  h+='<section><h2>'+x.howH+'</h2><div class="steps">'+x.s.map(function(s,i){var extra="";

     if(i===1)extra='<div class="upi"><a class="btn g" href="'+TG+'" target="_blank" rel="noopener">✈️ '+x.tg+'</a></div>';
     return'<div class="stp"><i>'+(i+1)+'</i><div><b>'+s[0]+'</b><p>'+s[1]+'</p>'+extra+'</div></div>'}).join("")+'</div></section>';
