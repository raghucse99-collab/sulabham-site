 h+='<p><b>'+x.avgr+':</b> '+(avg(rows.map(function(r){return r.r}))??'–')+'% &nbsp; <b>'+x.avgq+':</b> '+(avg(rows.map(function(r){return r.q}))??'–')+'% &nbsp; <b>'+x.gain+':</b> '+(ga==null?'–':(ga>0?'+':'')+ga+'%')+' &nbsp; <span class="note">('+rows.length+' '+x.days+')</span></p>';
 h+=chart(rows)+'<p class="note">'+x.leg+' '+x.tgt+'</p>';
 var wk={};rows.forEach(function(r){var d=D.days.filter(function(y){return y.n===r.n})[0];(wk[d.w]=wk[d.w]||[]).push(r)});
 var ws=Object.keys(wk).map(Number).sort(function(a,b){return a-b}),pv=null;
 h+='<p><b>'+x.wkly+'</b></p><table class="wt"><tr><th>'+x.wk+'</th><th>'+x.ph+'</th><th>'+x.qz+' %</th></tr>'+ws.map(function(w){var a=avg(wk[w].map(function(r){return r.r})),b=avg(wk[w].map(function(r){return r.q}));var ar=pv!=null&&a!=null?(a>pv?' ▲':a<pv?' ▼':' ='):'';if(a!=null)pv=a;return'<tr><td>'+w+'</td><td>'+(a==null?'–':a+'%'+ar)+'</td><td>'+(b==null?'–':b+'%')+'</td></tr>'}).join("")+'</table>';
 var wl=rows.filter(function(r){return(r.r!=null&&r.r<60)||(r.q!=null&&r.q<60)});
 h+='<p><b>'+x.weak+'</b></p>'+(wl.length?wl.map(function(r){var d=D.days.filter(function(y){return y.n===r.n})[0];return'<div>• '+t().day+' '+r.n+': '+d.items.map(function(i){return esc(nm(i))}).join(" · ")+' ('+(r.r==null?'–':r.r+'%')+' / '+(r.q==null?'–':r.q+'%')+')'+(r.m?'<br><span class="note">'+esc(r.m)+'</span>':'')+'</div>'}).join(""):'<span class="note">'+x.nowk+'</span>');
 return h+'</div>';
}
function t(){return T[L]}function nm(o){return o[L]||o.en}
function iso(d){return d.toISOString().slice(0,10)}
function addD(s,k){var d=new Date(s+"T00:00:00Z");d.setUTCDate(d.getUTCDate()+k);return iso(d)}
function today(){return iso(new Date(Date.now()+5.5*3600e3))}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;")}
function pad(n){return("0"+n).slice(-2)}
function row(i){return'<b><span class="tag '+i.s+'">'+t().sub[i.s]+'</span>'+esc(nm(i))+'</b>'}
function dueList(){var td=today(),out=[];D.days.forEach(function(x){if(x.rev||!P[x.n])return;[1,3,7,15,30].forEach(function(k){if(addD(P[x.n],k)===td)out.push({x:x,k:k})})});return out}
function list(){
 var tt=t(),h='<h1>'+tt.h+'</h1><p class="lede">'+tt.lede+'</p>';
 var nd=D.days.filter(function(x){return!x.rev}),dn=nd.filter(function(x){return P[x.n]}).length;
 h+='<div class="box"><b>'+tt.prog(dn,nd.length)+'</b><div class="prog"><i style="width:'+Math.round(dn*100/nd.length)+'%"></i></div><span class="note">'+tt.note+'</span></div>';
 h+=progBox();
 var du=dueList();h+='<div class="box due"><h3>'+tt.due+'</h3>'+(du.length?du.map(function(o){return'<div>• '+tt.day+' '+o.x.n+' (+'+o.k+'): '+o.x.items.map(function(i){return esc(nm(i))}).join(" · ")+'</div>'}).join(""):'<span class="note">'+tt.nodue+'</span>')+'</div>';
 h+='<div class="box how"><h3>'+tt.how+'</h3><ol>'+tt.steps.map(function(s){return'<li>'+s+'</li>'}).join("")+'</ol></div>';
 var w=0,ph=0;D.days.forEach(function(x){
  if(x.ph&&x.ph!==ph){ph=x.ph;h+='<div class="ph">'+tt.ph[ph]+'</div>'}
  if(x.w!==w){w=x.w;h+='<div class="wk">'+tt.wk(w)+'</div>'}
  if(x.rev){if(x.ready){h+='<button class="day rev'+(P[x.n]?' done':'')+'" data-d="'+x.n+'"><span class="n">'+x.n+'</span><span class="t"><b>'+tt.revr+'</b></span></button>'}else h+='<div class="day rev"><span class="n">🔁</span><span class="t"><b>'+tt.rev+'</b></span></div>';return}
  var cls="day"+(P[x.n]?" done":"")+(x.ready?"":" soon");
  h+='<button class="'+cls+'" data-d="'+x.n+'"'+(x.ready?'':' disabled')+'><span class="n">'+x.n+'</span><span class="t">'+x.items.map(row).join("")+(x.ready?'':'<small>'+tt.soon+'</small>')+'</span></button>'});
 app.innerHTML=h;
 app.querySelectorAll("[data-d]").forEach(function(b){b.onclick=function(){location.hash="d"+b.getAttribute("data-d")}});
}
function day(n){
 var x=D.days.filter(function(y){return String(y.n)===String(n)})[0];if(!x||!x.ready){list();return}
 var tt=t(),rv0=/^R/.test(n),f=rv0?"plan/rev"+pad(String(n).slice(1)):"plan/day"+pad(n);
 var h='<button class="back">'+tt.back+'</button><h1>'+(rv0?tt.revt+' '+n:tt.day+' '+n)+'</h1><p class="lede">'+(rv0?tt.revr:x.items.map(row).join("<br>"))+'</p>';
 var rv=P[n]&&!rv0?'<p class="note">'+tt.revon+': '+[1,3,7,15,30].map(function(k){return addD(P[n],k)}).join(" · ")+'</p>':'';
 h+='<div class="btns"><a class="pri" href="'+f+'_'+L+'.pdf" download>'+tt.pdf+'</a><button id="pr">'+tt.prn+'</button><button class="'+(P[n]?'':'ok')+'" id="mk">'+(P[n]?tt.undone:tt.done)+'</button></div>'+rv+'<div id="body" class="box">…</div><div id="sc" class="box sc"></div>';
 app.innerHTML=h;window.scrollTo(0,0);
 app.querySelector(".back").onclick=function(){location.hash=""};
 document.getElementById("pr").onclick=function(){window.print()};
 document.getElementById("mk").onclick=function(){if(P[n])delete P[n];else P[n]=today();save();day(n)};
 document.getElementById("body").addEventListener("click",function(e){var li=e.target.closest&&e.target.closest(".nt .opts li");if(!li)return;var q=li.closest(".q");if(q.classList.contains("done"))return;var ol=li.parentNode,k=[].indexOf.call(ol.children,li),a=+ol.dataset.a;[].forEach.call(ol.children,function(c,i){if(i===a)c.classList.add("ok")});if(k!==a)li.classList.add("bad");q.classList.add("done");var o=S[n]=S[n]||{};o.a=o.a||{};o.a[qs().indexOf(q)]=k;saveS();renderScore(n)});
 fetch(f+"_"+L+".html?v="+Date.now()).then(function(r){if(!r.ok)throw 0;return r.text()}).then(function(s){document.getElementById("body").innerHTML=s;restoreQuiz(n);renderScore(n)}).catch(function(){document.getElementById("body").textContent=tt.soon});
}
function route(){var m=location.hash.match(/^#d(R?\d+)/);if(m)day(m[1][0]==="R"?m[1]:+m[1]);else list()}
function setL(l){L=l;try{localStorage.setItem("sul_lang",l)}catch(e){}document.documentElement.lang=l;document.querySelectorAll(".lang button").forEach(function(b){b.setAttribute("aria-pressed",b.dataset.l===L)});route()}
document.querySelectorAll(".lang button").forEach(function(b){b.onclick=function(){setL(b.dataset.l)}});
window.addEventListener("hashchange",route);
fetch("plan/index.json?v="+Date.now()).then(function(r){return r.json()}).then(function(j){D=j;setL(L)});
})();
</script>
